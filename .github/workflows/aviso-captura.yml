name: Aviso de captura (BCR y demás)

# SOLO AVISA. No captura nada, no toca L0 ni los catálogos (ADR-007, ADR-008, regla 1 de CLAUDE.md).
# Corre scripts/verificar_l0.R una sola vez el día 1 de cada mes (ventana mensual de
# doc/backlog_captura_vintages.md; regla 9: una pasada, al ritmo de publicación, nunca repetida).
# Compara lo que sirve cada fuente contra sha256_norm del manifiesto, que está versionado, así que
# no necesita los .xlsx de L0 (por eso no se corre `make raw`, cuyo primer paso exige L0 en disco).
# Si hay CAMBIO o MANUAL_PENDIENTE (aunque otra fuente dé ERROR) abre un issue con el bloque copiable; la captura sigue siendo
# local y deliberada. Un ERROR (fuente caída o bloqueada desde la IP del runner) hace fallar el
# workflow, de forma visible (regla 6); el bloqueo NO se evade (regla 9).

on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  avisar:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Instalar dependencias de sistema
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Verificar fuentes en vivo contra el manifiesto
        id: verificar
        run: |
          set +e
          Rscript scripts/verificar_l0.R > verificacion.txt 2>&1
          estado=$?
          cat verificacion.txt
          echo "estado=$estado" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Abrir issue si hay CAMBIO o MANUAL_PENDIENTE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -Eq '^== [0-9]+ CAMBIO|MANUAL_PENDIENTE' verificacion.txt; then
            fecha=$(date -u +%Y-%m-%d)
            {
              echo "Ventana mensual de captura ($fecha). Salida de \`scripts/verificar_l0.R\`; la captura es local, ver \`doc/backlog_captura_vintages.md\`."
              echo
              echo '```'
              tail -n 80 verificacion.txt
              echo '```'
            } > cuerpo.md
            gh issue create --title "Captura pendiente: ventana de $fecha" --body-file cuerpo.md
          else
            echo "Sin CAMBIO ni MANUAL_PENDIENTE: no se abre issue."
          fi

      - name: Fallar si la verificación dio ERROR
        if: steps.verificar.outputs.estado != '0'
        run: |
          echo "verificar_l0.R salió con ${{ steps.verificar.outputs.estado }} (ERROR de fuente o bloqueo)."
          tail -n 40 verificacion.txt
          exit 1
