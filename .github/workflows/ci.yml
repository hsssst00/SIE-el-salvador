name: CI

on:
  push:
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      # Dependencias de SISTEMA, no de R. `polite` (verificación de robots.txt, regla 9)
      # importa `usethis`, que importa `gert (>= 1.4.1)`, que enlaza contra libgit2. Sin
      # esto, renv::restore() instala el binario de gert y falla al cargarlo:
      # "libgit2.so.1.7: cannot open shared object file" (corridas 101 y 102, 2026-09-04).
      # Cadena verificada en los DESCRIPTION reales, no supuesta.
      - name: Instalar dependencias de sistema
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev

      # BLAS/LAPACK de referencia (remediación I4 de la auditoría independiente de Fase 5): la reproducción bit a bit
      # depende de la librería de álgebra lineal, y la máquina de la corrida única usa la de referencia. Con OpenBLAS,
      # V10 y el random forest de V20 dan otros valores que en Windows.
      - name: Fijar BLAS/LAPACK de referencia
        run: |
          sudo apt-get install -y libblas3 liblapack3
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/blas/libblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/lapack/liblapack.so.3
          Rscript --vanilla -e 'b <- sessionInfo()$BLAS; cat("BLAS:", b, "\n"); if (grepl("openblas", b, ignore.case = TRUE)) stop("CI sigue con OpenBLAS")'

      - uses: r-lib/actions/setup-renv@v2

      - name: Validación de esquema de catálogos (validate_catalogs.R)
        run: Rscript src/validacion/validate_catalogs.R
        continue-on-error: false

      - name: Correr pruebas
        run: Rscript -e 'testthat::test_dir("tests")'

      # Criterio de cierre de Fase 4: el motor de evaluación se prueba sobre datos sintéticos antes
      # de estimar cualquier modelo (senda §4). No necesita L3, así que corre acá. Falla con stop().
      - name: Verificación sintética del motor de evaluación (make eval-sintetico)
        run: Rscript src/evaluacion/verificar_motor_sintetico.R

  check-l0-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Verificar consistencia cruzada de L0 (manifiesto <-> 08_vintages)
        run: Rscript scripts/check_l0_integrity.R
