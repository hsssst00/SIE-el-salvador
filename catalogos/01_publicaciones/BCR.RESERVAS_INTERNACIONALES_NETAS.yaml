publicacion_id: BCR.RESERVAS_INTERNACIONALES_NETAS
institucion_id: BCR
nombre: "Reservas Internacionales Netas del BCR"
periodicidad: mensual
formato: web / csv / xlsx
url: https://estadisticas.bcr.gob.sv/serie/reservas-internacionales-netas-bcr
cobertura_temporal: "ene-1997 a jul-2026, verificado por Harold directamente contra el portal (2026-08-09)."
condiciones_uso: "En gestión, no por relevamiento pendiente (ADR-008, enmienda 2026-08-12): consulta formal enviada al BCR el 2026-08-07, ampliada el 2026-08-12 a solicitud de la propia institución; fecha de corte 2026-10-12. Aplica mientras tanto el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Cronología completa y consecuencias del vencimiento sin respuesta en ADR-008."
notas: |
  Fuente: BCR. Con desglose de activos y pasivos según el catálogo de
  oferta estadística. Variable estándar de estabilidad externa,
  particularmente relevante para una economía dolarizada como El
  Salvador (sin banco central emisor de moneda propia desde 2001).
