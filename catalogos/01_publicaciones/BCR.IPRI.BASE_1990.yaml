notas: |
  Fuente: BCR. Identificado dentro de la sección "5. Estadísticas del
  Sistema de Cuentas Nacionales Base 1990" de la página de clasificación
  del sector real, ítem 5.5 — misma página general que aloja
  BCR.IVAE.BASE_1990 y BCR.IVOPI.BASE_1990 (sin URL de /serie/ dedicada
  confirmada, a diferencia de las series vigentes).
  Antecesor directo de BCR.IPP: el documento metodológico del IPP declara
  textualmente que este índice "pasará a sustituir al IPRI" — pero la
  ventana de cobertura de IPP (desde ene-2009) se solapa con IPRI (hasta
  oct-2017) por casi 8 años, no es un corte limpio. Ver 09_rupturas.csv,
  R010.
  Identificado vía búsqueda externa por Claude (2026-08-11), no vía
  Cowork ni verificación directa de Harold contra el portal — tratar con
  la misma cautela que cualquier hallazgo de Cowork no confirmado.
  Anteriormente esta serie solo existía como referencia dentro de la
  nota de BCR.IPP.yaml, sin registro propio.

  Intento de verificación directa por Harold (2026-08-12): la URL
  https://estadisticas.bcr.gob.sv/clasificacion/sector-real devolvió
  error 500 — no se pudo confirmar. Pendiente reintentar. Esta misma
  URL es compartida con BCR.IVOPI.BASE_1990 y
  BCR.IVAE.PROMEDIO_MOVIL_12M — si el error persiste, revisar también
  esas dos publicaciones.

  Verificación directa por Harold (2026-08-17): la URL cargó
  correctamente esta vez (a diferencia del intento de 2026-08-12, que
  dio error 500) y confirmó que la cobertura temporal declarada es
  correcta. El error anterior parece haber sido transitorio del lado
  del portal del BCR, no un problema estructural de la URL — es
  evidencia a favor (no confirmación completa) de que
  BCR.IVOPI.BASE_1990 y BCR.IVAE.PROMEDIO_MOVIL_12M, que comparten esta
  misma URL, también podrían cargar bien ahora. Siguen marcadas como
  pendientes hasta que se verifiquen por separado — el contenido
  específico de cada una no se confirmó en esta revisión.

  Corrección de URL (Claude, chat, 2026-08-20): la URL registrada hasta
  ahora (`.../clasificacion/sector-real`) es la página de índice del
  sector real, no la página de esta serie específica — ya se había
  anotado esto arriba ("sin URL de /serie/ dedicada confirmada"), pero
  seguía sin resolverse. Se navegó la página de índice, se ubicó la
  fila "5.5 Índice de Precios Industriales (IPRI). Enero 1998-oct.2017"
  y se extrajo su enlace real:
  `.../serie/indice-de-precios-industriales-ipri-enero-1998-oct-2017`.
  Campo `url` actualizado. La verificación de cobertura_temporal de
  Harold (2026-08-17) sigue siendo válida — el título de la fila
  ("Enero 1998-oct.2017") coincide con lo ya registrado. No verificado
  en esta corrección: contenido de la nueva URL más allá del título de
  la fila que la origina.