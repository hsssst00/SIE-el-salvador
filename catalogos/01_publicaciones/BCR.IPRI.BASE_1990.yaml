notas: |
  Fuente: BCR. Identificado dentro de la sección "5. Estadísticas del
  Sistema de Cuentas Nacionales Base 1990" de la página de clasificación
  del sector real, ítem 5.5 — misma página general que aloja
  BCR.IVAE.BASE_1990 y BCR.IVOPI.BASE_1990 (sin URL de /serie/ dedicada
  confirmada, a diferencia de las series vigentes).
  Antecesor directo de BCR.IPP: el documento metodológico del IPP declara
  textualmente que este índice "pasará a sustituir al IPRI" — pero la
  ventana de cobertura de IPP (desde ene-2009) se solapa con IPRI (hasta
  oct-2017) por casi 8 años, no es un corte limpio. Ver 09_rupturas.csv,
  R010.
  Identificado vía búsqueda externa por Claude (2026-08-11), no vía
  Cowork ni verificación directa de Harold contra el portal — tratar con
  la misma cautela que cualquier hallazgo de Cowork no confirmado.
  Anteriormente esta serie solo existía como referencia dentro de la
  nota de BCR.IPP.yaml, sin registro propio.

  Intento de verificación directa por Harold (2026-08-12): la URL
  https://estadisticas.bcr.gob.sv/clasificacion/sector-real devolvió
  error 500 — no se pudo confirmar. Pendiente reintentar. Esta misma
  URL es compartida con BCR.IVOPI.BASE_1990 y
  BCR.IVAE.PROMEDIO_MOVIL_12M — si el error persiste, revisar también
  esas dos publicaciones.
