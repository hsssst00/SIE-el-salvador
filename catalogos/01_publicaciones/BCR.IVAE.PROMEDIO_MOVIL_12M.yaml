notas: |
  Fuente: BCR. Producto derivado (transformación propia del BCR sobre
  el IVAE base 1990, no una serie primaria independiente) — descontinuado
  en la misma fecha que BCR.IVAE.BASE_1990. No se ha verificado si existe
  un equivalente vigente calculado sobre BCR.IVAE.VIGENTE. Prioridad baja
  para el proyecto: es una transformación que el propio proyecto puede
  replicar (promedio móvil 12m) a partir de la serie vigente, D4/D5.

  Verificación directa por Harold (2026-08-17) contra el portal: la
  cobertura real es ene-1990 a dic-2017, no ene-1991 como quedó
  registrado en el relevamiento inicial (2026-08-09, commit 362d4fd).
  Corrige un error de trazabilidad de un año en el extremo inicial.
  Confirmado en la misma sesión en que se corrigió un error inverso en
  BCR.IVOPI.BASE_1990 (ver notas de esa publicación) — ambas
  publicaciones comparten URL y quedaron verificadas contra el mismo
  intercambio con Harold. Es internamente consistente con que las tres
  publicaciones asociadas a la metodología base 1990 en esta página
  (IVAE.BASE_1990, IVOPI, y este promedio móvil) compartan el mismo
  extremo inicial, ene-1990.
