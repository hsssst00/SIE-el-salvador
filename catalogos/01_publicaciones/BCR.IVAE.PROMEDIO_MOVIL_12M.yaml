cobertura_temporal: "ene-1990 a dic-2017 (rango de tabla). Primer valor real: dic-1990 — celdas de ene-1990 a nov-1990 vacías (verificado por Harold contra la celda real, 2026-08-20). Verificado directamente por Harold contra el portal (2026-08-17). Corrige el valor anterior (ene-1991), que provenía del relevamiento inicial de Claude (2026-08-09, commit 362d4fd) y no había sido verificado contra el portal."
condiciones_uso: "No verificado — pendiente relevamiento (ADR-008)."
notas: |
  Fuente: BCR. Producto derivado (transformación propia del BCR sobre
  el IVAE base 1990, no una serie primaria independiente) — descontinuado
  en la misma fecha que BCR.IVAE.BASE_1990. No se ha verificado si existe
  un equivalente vigente calculado sobre BCR.IVAE.VIGENTE. Prioridad baja
  para el proyecto: es una transformación que el propio proyecto puede
  replicar (promedio móvil 12m) a partir de la serie vigente, D4/D5.

  Verificación directa por Harold (2026-08-17) contra el portal: la
  cobertura real es ene-1990 a dic-2017, no ene-1991 como quedó
  registrado en el relevamiento inicial (2026-08-09, commit 362d4fd).
  Corrige un error de trazabilidad de un año en el extremo inicial.
  Confirmado en la misma sesión en que se corrigió un error inverso en
  BCR.IVOPI.BASE_1990 (ver notas de esa publicación) — ambas
  publicaciones comparten URL y quedaron verificadas contra el mismo
  intercambio con Harold. Es internamente consistente con que las tres
  publicaciones asociadas a la metodología base 1990 en esta página
  (IVAE.BASE_1990, IVOPI, y este promedio móvil) compartan el mismo
  extremo inicial, ene-1990.

  Corrección de URL (Claude, chat, 2026-08-20): la URL registrada hasta
  ahora (`.../clasificacion/sector-real`) es la página de índice del
  sector real, no la página de esta serie específica. Se navegó la
  página de índice, se ubicó la fila "5.2 IVAE Promedio móvil de los
  últimos doce meses de la serie en tendencia ciclo. Período ene /1991
  - dic /2017" y se extrajo su enlace real:
  `.../serie/ivae-promedio-movil-de-los-ultimos-doce-meses-de-la-serie-en-tendencia-ciclo-periodo-ene-1991-dic-2017`.
  Campo `url` actualizado.

  **Contradicción sin resolver, señalada explícitamente:** el slug de
  la URL real y el título de la fila que la origina dicen los dos
  "ene /1991" — no "ene /1990". Esto contradice directamente el valor
  de `cobertura_temporal` de este archivo (ene-1990), que Harold
  corrigió explícitamente el 2026-08-17 desde ene-1991 hacia ene-1990.
  Hay además una razón matemática que favorece ene-1991: un promedio
  móvil de 12 meses no puede tener su primera observación en el mismo
  mes que la serie base que promedia — necesita 12 observaciones
  previas. Si BCR.IVAE.BASE_1990 arranca en ene-1990, el promedio móvil
  de 12 meses sobre esa serie no podría empezar antes de dic-1990 o
  ene-1991, según la convención de centrado. No se revierte la
  corrección de Harold en esta edición — no es una verificación
  independiente contra el contenido real de la serie, es una
  observación sobre el título/slug de la página, que podría estar mal
  redactado por el propio BCR igual que puede estar bien. Queda como
  pendiente de verificación directa antes de usar esta serie.

  **Contradicción resuelta (Harold, 2026-08-20), verificado contra la
  celda real, no contra el título de la página:** la serie tiene
  celdas vacías desde enero hasta noviembre de 1990; el primer valor
  real cae en la columna de diciembre de 1990. Esto reconcilia las dos
  piezas de evidencia que parecían contradictorias: `cobertura_temporal`
  (ene-1990) describe el rango declarado de la tabla/columna, que
  arranca en ene-1990 aunque vacío los primeros once meses — coherente
  con la razón matemática ya señalada (un promedio móvil de 12 meses
  sobre una serie que arranca en ene-1990 no puede tener su primer
  valor real antes de dic-1990). El "ene /1991" del título de la
  página del BCR queda sin explicación resuelta — posiblemente una
  redacción del propio BCR que redondea o describe el rango de forma
  distinta a como está la tabla — pero ya no es evidencia en contra de
  lo registrado, porque lo que importa para el proyecto es la celda
  real, no el título. Implicación para D5/transformaciones: si esta
  serie se usa, el tramo ene-nov 1990 debe tratarse como ausente
  (celda vacía), no como cero — coherente con la convención de valores
  ausentes de la senda §3.4.