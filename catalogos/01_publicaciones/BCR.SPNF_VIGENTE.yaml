publicacion_id: BCR.SPNF_VIGENTE
institucion_id: BCR
nombre: "Sector Público No Financiero — serie mensual (vigente, desde 2020)"
periodicidad: mensual
formato: web / csv / xlsx
url: https://estadisticas.bcr.gob.sv/serie/sector-publico-no-financiero-serie-desde-enero-de-2020
cobertura_temporal: "ene-2020 a jun-2026, verificado por Harold directamente contra el portal (2026-08-09)."
condiciones_uso: "En gestión, no por relevamiento pendiente (ADR-008, enmienda 2026-08-12): consulta formal enviada al BCR el 2026-08-07, ampliada el 2026-08-12 a solicitud de la propia institución; fecha de corte 2026-10-12. Aplica mientras tanto el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Cronología completa y consecuencias del vencimiento sin respuesta en ADR-008."
notas: |
  Fuente: BCR. Nueva metodología, vigente. Existe también una serie
  predecesora, ahora catalogada por separado: ver
  BCR.SPNF_SERIE_1994_2025 y 09_rupturas.csv, R013.
  Decisión de diseño (2026-08-09, confirmada por Harold): el BCR pasa a
  ser fuente PRIMARIA para estadísticas fiscales del SPNF, dado que
  ofrece series propias con cobertura igual o mejor que las de Hacienda.
  Las publicaciones ya catalogadas de Hacienda (MH.INGRESOS_TOTALES_ANUAL,
  MH.DEUDA_SPNF_ANUAL, MH.PERFIL_DEUDA_SPNF, etc.) quedan como fuente
  SECUNDARIA — ver nota cruzada añadida en cada una de ellas.

  Corrección de mapeo (2026-08-26, decisión de Harold): la fila "Sector
  Público No Financiero (Serie 1994-2025)" de
  doc/calendario_divulgacion_bcr.csv corresponde a ESTA publicación
  (BCR.SPNF_VIGENTE), no a BCR.SPNF_SERIE_1994_2025 — resuelve la
  pendiente registrada en doc/bitacora_fuentes_fragiles.md (sección "BCR
  — SPNF_SERIE_1994_2025: fila del calendario de divulgación no
  corresponde a esta publicación"). El nombre textual de la fila del
  calendario quedó fijado al nombre histórico de la serie predecesora
  (congelada en 2025-M12), pero la publicación mensual activa que el BCR
  efectivamente anuncia en ese calendario es esta serie vigente. El
  patrón de rezago del calendario (periodo_referencia_max + N meses) sí
  aplica acá, a diferencia de la serie predecesora.
