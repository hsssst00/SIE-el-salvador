condiciones_uso: "En gestión, no por relevamiento pendiente (ADR-008, enmienda 2026-08-12): consulta formal enviada al BCR el 2026-08-07, ampliada el 2026-08-12 a solicitud de la propia institución; fecha de corte 2026-10-12. Aplica mientras tanto el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Cronología completa y consecuencias del vencimiento sin respuesta en ADR-008."
notas: |
  Fuente: BCR. Identificado vía relevamiento de Claude Cowork
  (2026-08-09); cobertura confirmada por Harold directamente contra el
  portal (2026-08-09). Es el equivalente vigente (SCN2008, ref. 2014)
  del "PIB por rama de actividad económica" — la versión base 1990
  (descontinuada, 1990-2016) no está catalogada por separado en esta
  pasada. Relevante si se activa el enfoque bottom-up (extensión
  diferida, D1 de la senda). Periodicidad anual — no cubre la ventaja de
  frecuencia mensual/trimestral que persigue D6.4.
