publicacion_id: BCR.TASAS_INTERES_MINIMAS_MAXIMAS
institucion_id: BCR
nombre: "Tasas de Interés Bancarias, Mínimas y Máximas Contratadas"
periodicidad: semanal
formato: web / csv / xlsx
url: https://estadisticas.bcr.gob.sv/serie/5-1-2-1-semanal-tasas-de-interes-bancarias-minimas-y-maximas-contratada
cobertura_temporal: "2-ene-2009 a 31-jul-2026, verificado por Harold directamente contra el portal (2026-08-12) — corrige la fecha de fin, previamente catalogada como 24-jul-2026 según relevamiento de Cowork."
condiciones_uso: "En gestión, no por relevamiento pendiente (ADR-008, enmienda 2026-08-12): consulta formal enviada al BCR el 2026-08-07, ampliada el 2026-08-12 a solicitud de la propia institución; fecha de corte 2026-10-12. Aplica mientras tanto el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Cronología completa y consecuencias del vencimiento sin respuesta en ADR-008."
notas: |
  Metodología 2022, vigente. idCuadro=286. 34 variables — dos bloques
  espejo (Tasas Mínimas / Tasas Máximas), cada uno con tasas por
  depósito (30 a 360 días) y por préstamo (hasta/más de 1 año,
  particulares/empresas, vivienda).

  Serie conceptualmente distinta de BCR.TASAS_INTERES_PROMEDIO_PONDERADO:
  son tasas nominales pactadas en NUEVOS contratos, no promedios
  ponderados del stock — no combinar ambas sin declarar esa diferencia
  conceptual. Fuente: Bancos Comerciales.
