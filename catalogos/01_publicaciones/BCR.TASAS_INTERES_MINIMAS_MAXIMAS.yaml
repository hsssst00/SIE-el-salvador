notas: |
  Metodología 2022, vigente. idCuadro=286. 34 variables — dos bloques
  espejo (Tasas Mínimas / Tasas Máximas), cada uno con tasas por
  depósito (30 a 360 días) y por préstamo (hasta/más de 1 año,
  particulares/empresas, vivienda).

  Serie conceptualmente distinta de BCR.TASAS_INTERES_PROMEDIO_PONDERADO:
  son tasas nominales pactadas en NUEVOS contratos, no promedios
  ponderados del stock — no combinar ambas sin declarar esa diferencia
  conceptual. Fuente: Bancos Comerciales.
