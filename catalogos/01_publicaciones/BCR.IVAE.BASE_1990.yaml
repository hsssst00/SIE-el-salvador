nombre: "Índice de Volumen de Actividad Económica (IVAE), base 1990 — global y por sectores"
periodicidad: mensual
formato: web / csv / xlsx
url: https://estadisticas.bcr.gob.sv/serie/indice-de-volumen-actividad-economica-ivae-global-y-por-sectores-periodo-ene-1990-dic-2017-2
cobertura_temporal: "ene-1990 a dic-2017. Verificado directamente por Harold contra el portal (2026-08-21): ene-1990 tiene valor real en la celda, no es solo el extremo declarado del rango de la tabla — a diferencia de BCR.IVAE.PROMEDIO_MOVIL_12M, cuyo primer valor real es dic-1990. La inferencia de que las tres publicaciones base 1990 comparten extremo inicial no se usó como sustento: se verificó esta ficha por separado."
condiciones_uso: "En gestión, no por relevamiento pendiente (ADR-008, enmienda 2026-08-12): consulta formal enviada al BCR el 2026-08-07, ampliada el 2026-08-12 a solicitud de la propia institución; fecha de corte 2026-10-12. Aplica mientras tanto el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Cronología completa y consecuencias del vencimiento sin respuesta en ADR-008."
notas: |
  Fuente: BCR, Base de Datos Económica y Financiera, Sector Real —
  sección "Estadísticas del Sistema de Cuentas Nacionales Base 1990
  (sin actualización por vigencia de nueva metodología)". Declarada
  explícitamente descontinuada por el propio BCR, no solo desactualizada
  de facto.
  Coexiste en calendario con BCR.IVAE.VIGENTE durante 2005-2017, pero NO
  es un traslape tipo empalme (a diferencia del PIB en D3/ADR-003, donde
  hay un valor puntual compartido como ancla). Confirmado visualmente
  por Harold contra capturas de ambas series: usan clasificaciones
  sectoriales distintas y no directamente reconciliables — la serie
  base 1990 agrupa categorías de forma más agregada y con terminología
  antigua (ej. "Agricultura, caza, silvicultura y pesca" unificado;
  "Electricidad, gas y agua" combinados), mientras la vigente usa CIIU
  Rev.4 desagregado (~19 actividades, coherente con el SCN2008 ya visto
  en el PIB). Sin tabla de concordancia verificada entre ambas
  clasificaciones. Cualquier intento de empalme propio en Fase 3
  requeriría primero construir esa concordancia sector por sector — no
  asumir que es un ejercicio trivial de encadenamiento como el del PIB.
