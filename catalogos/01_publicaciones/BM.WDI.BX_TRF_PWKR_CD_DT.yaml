institucion_id: BM
nombre: "Remesas personales recibidas (BX.TRF.PWKR.CD.DT), World Development Indicators"
periodicidad: anual
formato: api (REST; JSON o XML)
url: https://api.worldbank.org/v2/country/SLV/indicator/BX.TRF.PWKR.CD.DT
cobertura_temporal: "Confirmado por Claude Code (2026-08-18, re-confirmado 2026-08-28): 1976 a 2025, 50 años con valor no nulo, consecutivos, sin huecos internos (la respuesta trae 66 años en total, 1960-2025; 1960-1975 vienen con value=null)."
condiciones_uso: "Idénticas a las de BM.WDI.yaml (ficha de familia) — ver esa ficha para el texto completo (licencia CC-BY 4.0, cláusula de mediación, formato de atribución, salvedad de datasets de terceros). No repetido acá para evitar duplicación (senda §10.6)."
notas: |
  Fuente: Banco Mundial, World Development Indicators. Publicación
  individual desprendida de BM.WDI (ficha de familia) — un publicacion_id
  por indicador desde el inicio, aplicando preventivamente la regla de
  doc/adr/ADR-007-politica-vintages.md (nota de seguimiento 2026-08-27,
  originada por la colisión de vintage_id en FRED.INDICADORES_MENSUALES_EEUU).

  fecha_publicacion: se usa el campo `lastupdated` nativo de la respuesta de
  la API v2 del Banco Mundial (objeto de metadatos de página), NO una fecha
  de captura sintética. Verificado por Claude Code (2026-08-28, Bloque 0 del
  handoff FMI/BM): `lastupdated` = "2026-07-13" para este indicador, en
  formato ISO 8601. Es la fecha de última actualización de la base WDI
  (fuente id=2) — común a todos los indicadores de esa base, no por
  indicador ni por observación (menos fino que el realtime_start de FRED,
  que es por observación, pero es una fecha declarada por la fuente y ligada
  al vintage de los datos). Decisión de Harold, 2026-08-28, al ejecutarse el
  handoff: usar `lastupdated` en vez del patrón UT de fecha sintética que
  proponía el handoff original, porque la premisa de ese handoff ("sin
  equivalente nativo confirmado para WDI") resultó falsa.

  Predictor de remesas — la senda §1.3 identifica las remesas como
  variable externa dominante del error de pronóstico del PIB salvadoreño
  a horizontes largos, junto con la actividad de EE.UU. Contraste anual
  frente a BCR.REMESAS_FAMILIARES_MENSUAL (mensual, fuente primaria) y
  FMI.BOP (trimestral/anual, redundante con el BCR según su propia
  ficha) — esta es la tercera fuente independiente de la misma variable.
