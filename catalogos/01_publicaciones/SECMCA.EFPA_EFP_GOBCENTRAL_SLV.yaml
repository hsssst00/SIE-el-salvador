  2014-2025 para el cuadro completo. Esa discrepancia (metadato
  agregado vs. cobertura real por subsector) fue el motivo de
  desagregar esta publicación en vez de tratarla como una sola entrada
  — no volver a colapsar sin repetir esta verificación.
