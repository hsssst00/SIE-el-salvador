notas: |
  Fuente: SECMCA. Subsector S1311B = Gobierno central presupuestario.
  Metodología GFSM2014 (FMI), armonizada. Este es el subsector con
  mejor cobertura real de los tres verificados para este cuadro —
  contrasta con SECMCA.EFPA_EFP_SPNF_SLV y
  SECMCA.EFPA_EFP_SOCPUB_SLV, que solo tienen 2 años de dato real
