publicacion_id: MH.LETES_FLUJO_ANUAL
institucion_id: MH
nombre: "Flujo de Letras del Tesoro Público (LETES) — resumen anual"
periodicidad: anual
formato: web / xlsx
url: https://www.transparenciafiscal.gob.sv/ptf/es/PTF2-Ingresos.html
cobertura_temporal: "2011 a 2021 (marzo). Procedencia: relevamiento inicial, sin verificación individual registrada contra el portal. Tramo secundario (BCR es fuente primaria para estas series), por lo que no se priorizó."
condiciones_uso: "Resuelto por decisión, no por relevamiento (ADR-008, enmienda 2026-08-18): mismo patrón que ISSS — no se persigue esclarecimiento adicional con el Ministerio de Hacienda; aplica el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Detalle y motivo por institución en ADR-008."
notas: |
  Fuente: Dirección General de Tesorería, Ministerio de Hacienda. Tabla
  resumen (Saldo Anterior, Colocado, Pagado, Saldo) en miles de US$, una
  columna por año — es un agregado anual derivado de la actividad LETES,
  NO la fuente de detalle mensual (ver MH.LETES_INFORME_SALDOS para eso).
  Corregido 2026-08-09: se había catalogado inicialmente como mensual
  por error, al confundirse con el mandato legal de publicación mensual
  de LETES (que aplica al informe de saldos, no a esta tabla resumen).
