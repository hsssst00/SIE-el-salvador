publicacion_id: FMI.PCPS
institucion_id: FMI
nombre: "Primary Commodity Price System (PCPS) — precios internacionales de materias primas"
periodicidad: mensual
formato: api (SDMX 3.0; SDMX-JSON 2.0.0 / SDMX-ML 3.0.0)
url: https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/PCPS/+
cobertura_temporal: "Confirmado por Claude Code (2026-08-18): el dataflow responde. CORRECCIÓN a una asunción previa de este mismo bloque de trabajo: PCPS SÍ tiene dimensión COUNTRY (orden de clave real: COUNTRY.INDICATOR.DATA_TRANSFORMATION.FREQUENCY, confirmado contra la DSD_PCPS vía /structure/datastructure con references=all) — no es 'sin dimensión país' como se asumió al plantear esta verificación. El código de país para series de precios internacionales es G001 ('World'). Consulta real GET https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/PCPS/+/G001.PALLFNF.INDEX.M (índice de todos los commodities, transformación INDEX, frecuencia mensual): rango real 1992-M01 a 2026-M07, 415 observaciones mensuales continuas, sin huecos. Indicadores de petróleo/alimentos identificados en el codelist real CL_PCPS_INDICATOR (136 códigos, vía /structure): POILAPSP, POILBRE, POILDUB, POILWTI, POPEC (crudo, varios benchmarks); PFOOD, PFANDB, PNFUEL, PALLFNF, PVOIL (alimentos y no-combustible). Los códigos existen pero NO son idénticos a los candidatos anotados en FMI.WEO — PCPS usa PALLFNF/PNFUEL/PFOOD (sin sufijo W), mientras que las notas de WEO especulaban PALLFNFW/PNFUELW/PFOODW; no asumir que son la misma serie con nombre distinto sin confirmarlo indicador por indicador."
condiciones_uso: "Mismas condiciones que FMI.WEO — ver esa entrada. Pendiente verificación directa de Harold."
notas: |
  Fuente: FMI, Departamento de Investigación (agencia SDMX IMF.RES),
  dataflow PCPS, versión 9.0.0 al momento del relevamiento.

  Candidata directa a predictor de frecuencia mensual (senda §6.4) y a
  insumo de escenarios exógenos del Ejercicio B (senda §1.3, que nombra
  precios de importación entre los determinantes externos del error de
  pronóstico del PIB salvadoreño).

  Complementaria, NO sustituta, de BCR.INDICES_PRECIOS_COMERCIO_EXTERIOR
  ya catalogada: el índice del BCR mide precios de importación efectivos
  de El Salvador, mientras que PCPS mide precios internacionales de
  materias primas. El primero es el precio que El Salvador efectivamente
  paga; el segundo es el shock externo que lo determina en parte. Como
  predictor de frecuencia mensual, PCPS tiene la ventaja de publicarse
  con menos rezago.

  Relevamiento externo de Claude vía web (2026-08-12), sin Cowork.
  Pendiente verificación directa de Harold contra la API.
