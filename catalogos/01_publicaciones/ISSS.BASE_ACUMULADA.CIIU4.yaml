  https://www.transparencia.gob.sv/descarga_archivo.php?id=<base64>&inst=597255
  — no confirmada activa independientemente (a diferencia de la de
  ISSS.COTIZANTES.CIIU4, que sí se probó).

  Ver ISSS.COTIZANTES.CIIU4 para el detalle de la discontinuación y
  09_rupturas.csv R014 para la nota de reserva de información.