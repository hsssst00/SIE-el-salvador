notas: |
  Producida originalmente por DIGESTYC, heredada por ONEC desde dic-2022.
  Cobertura real verificada (2026-08-09) contra la sección de descarga de
  la base de datos en el portal de ONEC, que declara textualmente:
  "los enlaces de descarga de la base de datos de la Encuesta de Hogares
  de Propósitos Múltiples a partir del año 2010 al 2025" — confirmado
  por Harold directamente contra el portal.
  Esto contradice el texto descriptivo de la misma página de ONEC
  (onec.bcr.gob.sv/encuesta-de-hogares-de-propositos-multiples-ehpm/),
  que afirma "bases de datos desde 1990". Es una inconsistencia interna
  del propio sitio de ONEC entre su texto descriptivo y su sección de
  descarga real, no un desajuste con fuentes externas.
  Tratar como riesgo materializado de "cobertura menor a lo supuesta"
  (senda §8): la cobertura utilizable (2010-2025) es sustancialmente
  menor que la sugerida por el texto descriptivo (desde 1990).
  Módulo de empleo e ingreso es la fuente potencial más directa de
  indicadores laborales del proyecto. Periodicidad anual — no cubre la
  ventaja de frecuencia mensual de D6.4; su rol sería predictor anual o
  de nowcasting con rezago.
