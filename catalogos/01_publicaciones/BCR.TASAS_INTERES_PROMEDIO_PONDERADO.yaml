institucion_id: BCR
nombre: "Tasas de Interés Promedio Ponderado — serie mensual (Metodología 2022)"
periodicidad: mensual
formato: web / csv / xlsx
url: https://estadisticas.bcr.gob.sv/serie/5-1-1-2-mensual-promedio-ponderado-metodologia-2022
cobertura_temporal: "ene-2010 a jun-2026, verificado por Harold directamente contra el portal (2026-08-09)."
condiciones_uso: "No verificado — pendiente relevamiento (ADR-008)."
notas: |
  Fuente: BCR. Vigente, Metodología 2022. Cowork identificó una serie
  predecesora bajo metodología 1994-2021 ("Tasas de Interés Bancarias y
  Rendimiento de Reportos", cerrada dic-2021) que describe como
  "empalmable" con esta — NO verificado independientemente, tratar esa
  afirmación de empalmabilidad con la misma cautela que cualquier
  hallazgo de empalme no confirmado (ver precedente de IVAE/IPI: no
  asumir que un cambio de metodología permite empalme directo sin
  verificar).

  Variantes de esta misma serie a otras periodicidades, catalogadas
  como nota y no como registro propio (Fase 1, 2026-08-10, según
  relevamiento de Claude Cowork — pendiente verificación de Harold):
  semanal (idCuadro=279, cobertura 2009-24-jul-2026) y anual
  (idCuadro=284, cobertura 2010-2025, último dato 2025 por no haber
  cerrado 2026 aún).

  Actualización 2026-08-10: la serie predecesora bajo metodología
  1994-2021 mencionada arriba SÍ se catalogó como registro propio —
  ver BCR.TASAS_INTERES_BANCARIAS_MET1994_2021_MENSUAL (idCuadro=292,
  cobertura 1995-dic-2021) y sus variantes semanal/anual. Misma
  estructura de 20 variables que esta serie. La afirmación de
  "empalmable" sigue sin verificarse independientemente — no asumir
  empalme directo sin tabla de concordancia.
