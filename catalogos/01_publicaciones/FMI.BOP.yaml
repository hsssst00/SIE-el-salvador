notas: |
  Cobertura verificada en dos pasadas (2026-08-15). Primera pasada:
  consulta directa con curl contra
  https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/BOP/~/SLV?detail=serieskeysonly,
  resumida narrativamente por Claude Code sin revisión del JSON crudo
  por Claude (chat). Segunda pasada, a pedido explícito de Harold antes
  de registrar nada ("hay que verificar antes de generar conclusiones"):
  se repitió la consulta y se cruzó cada número contra el JSON real.
  Los cuatro coincidieron exactamente con el resumen inicial — no hubo
  que corregir nada, pero la verificación se hizo antes de escribir esta
  ficha, no después.

  DISTINCIÓN EPISTÉMICA IMPORTANTE (criterio transversal de la senda,
  §10.4): la cobertura temporal de este registro es una INFERENCIA
  propia (rango de valores de TIME_PERIOD que aparecen en las claves de
  observación de una consulta puntual), no un HECHO DOCUMENTADO por el
  FMI en forma de campo de metadata declarado. La respuesta no trae
  validFrom/validTo ni ningún campo de cobertura explícito — se revisó
  tanto `links` como `annotations` de la estructura y ambos estaban
  vacíos de esa información. Si en algún momento se necesita la
  cobertura oficial declarada por el FMI para este dataflow (no la
  inferida), hay que consultarla por otra vía — esta respuesta no la
  tiene.

  Pendiente (ver lista de pendientes de Fase 1): confirmar si el corte
  de cobertura de consumo de hogares/ISFLSH detectado en FMI.QNEA tiene
  algún paralelo o relación con BOP — no evaluado en esta sesión.

  Este catálogo entra como parte del criterio de inventario completo de
  Fase 1 (senda §3.3, decisión ya cerrada de Harold: 03_series es
  inventario de TODO lo publicado). No implica decisión de uso en la
  modelación del PIB — eso es aparte.
