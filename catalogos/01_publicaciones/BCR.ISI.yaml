cobertura_temporal: "ene-2012 a jul-2026. Verificado por Harold directamente contra el portal (2026-08-09): 2012 a jun-2026. Actualizado por Claude Code vía chromote en vivo (2026-08-26, sondeo liviano de homogenización): un mes más de dato disponible (jul-2026); inicio confirmado como ene-2012, no solo el año."
condiciones_uso: "En gestión, no por relevamiento pendiente (ADR-008, enmienda 2026-08-12): consulta formal enviada al BCR el 2026-08-07, ampliada el 2026-08-12 a solicitud de la propia institución; fecha de corte 2026-10-12. Aplica mientras tanto el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Cronología completa y consecuencias del vencimiento sin respuesta en ADR-008."
notas: |
  Fuente: BCR. Base diciembre 2009 = 100 — mismo año base que
  ONEC.IPC.BASE_2009. Mide inflación núcleo (excluye componentes
  volátiles del IPC, típicamente alimentos y energía) — complementario
  al IPC para diagnóstico de presiones de precios, no sustituto.
