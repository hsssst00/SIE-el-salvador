cobertura_temporal: "7-ene-2022 a 14-ago-2026. Verificado por Harold directamente contra el portal (2026-08-12): 7-ene-2022 a 7-ago-2026 — corrige la fecha de fin, previamente catalogada como 31-jul-2026 según relevamiento de Cowork. Actualizado por Claude Code vía chromote en vivo (2026-08-26, sondeo liviano de homogenización): una semana más de dato disponible (14-ago-2026), consistente con la periodicidad semanal de esta serie."
condiciones_uso: "En gestión, no por relevamiento pendiente (ADR-008, enmienda 2026-08-12): consulta formal enviada al BCR el 2026-08-07, ampliada el 2026-08-12 a solicitud de la propia institución; fecha de corte 2026-10-12. Aplica mientras tanto el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Cronología completa y consecuencias del vencimiento sin respuesta en ADR-008."
notas: |
  Clasificada por el BCR dentro de "6. Banco Central de Reserva"
  (bloque del Sector Monetario y Financiero no anticipado antes del
  relevamiento de Cowork), sin numeración jerárquica en la página
  fuente. idCuadro=336. Serie univariante (1 variable): tasa de
  interés, no volumen. Es la serie con el corte más reciente de todo
  el sector monetario (31-jul-2026).

  ADVERTENCIA DE POSIBLE SOLAPE evaluada y descartada (sesión
  2026-08-10): instrumento fiscal (LETES) publicado dentro del sector
  monetario, verificado contra MH.LETES_FLUJO_ANUAL y
  MH.LETES_INFORME_SALDOS — no hay duplicidad real. Esta serie es tasa
  de interés (BCR, 2022-2026); las de Hacienda son saldos/colocación
  (volumen, hasta 2021 sin evidencia de actualización posterior).
  Son complementarias: esta serie llena el vacío temporal que dejan
  los datos de Hacienda.
