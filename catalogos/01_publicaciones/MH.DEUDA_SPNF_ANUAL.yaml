publicacion_id: MH.DEUDA_SPNF_ANUAL
institucion_id: MH
nombre: "Deuda del Sector Público No Financiero (SPNF), con y sin pensiones"
periodicidad: anual
formato: web / xlsx
url: https://www.transparenciafiscal.gob.sv/ptf/es/PTF2-Ingresos.html
cobertura_temporal: "Real: 2011-2020. Proyectado: 2020-2029 (serie distinta, no confundir con ejecutado)."
condiciones_uso: "Resuelto por decisión, no por relevamiento (ADR-008, enmienda 2026-08-18): mismo patrón que ISSS — no se persigue esclarecimiento adicional con el Ministerio de Hacienda; aplica el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Detalle y motivo por institución en ADR-008."
notas: |
  Fuente: Dirección General de Inversión y Crédito Público, Ministerio
  de Hacienda. En millones de US$ y % del PIB. Última actualización
  observada: 21/07/2021 — igual que MH.INGRESOS_TOTALES_ANUAL, parece
  tabla estática sin verificar vigencia posterior. Menor prioridad que
  MH.PERFIL_DEUDA_SPNF para uso como predictor.
  Jerarquía de fuente (2026-08-09): el BCR publica series propias
  equivalentes con cobertura igual o mejor (ver
  BCR.SPNF_VIGENTE, BCR.GOBIERNO_CENTRAL_CONSOLIDADO,
  BCR.DEUDA_PUBLICA_TOTAL_VIGENTE) — por decisión de Harold, el BCR es
  ahora la fuente PRIMARIA para estadísticas fiscales del SPNF; esta
  publicación de Hacienda queda como fuente SECUNDARIA / verificación
  cruzada.
