publicacion_id: ONEC.IPC.BASE_2009
institucion_id: ONEC
nombre: "Índice de Precios al Consumidor (IPC), base diciembre 2009"
periodicidad: mensual
formato: web / csv / xlsx (Base de Datos Económica y Financiera) / pdf (boletín narrativo)
url: https://estadisticas.bcr.gob.sv/serie/indice-de-precios-al-consumidor-ipc
cobertura_temporal: "dic-2009 (mes base, índice=100 por construcción, compartido con el último dato de BASE_1992) + observaciones medidas de 2010-01 a 2026-08 (verificado 2026-09-16 por captura real, ver nota RESUELTO más abajo; esta línea decía 2026-06 antes de esa verificación)."
condiciones_uso: "Resuelto por decisión, no por relevamiento (ADR-008, enmienda 2026-08-18): mismo patrón que ISSS — no se persigue esclarecimiento adicional con ONEC/DIGESTYC; aplica el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Detalle y motivo por institución en ADR-008."
notas: |
  Serie vigente. Producida originalmente por DIGESTYC, heredada por ONEC.
  Serie numérica alojada en el dominio del BCR (igual que BASE_1992), no
  en onec.bcr.gob.sv. Metodología: Laspeyres (Young) + media geométrica,
  ~12,000 precios/mes, canasta actualizada con encuesta 3T2005-3T2006,
  manual OIT/FMI 2006.
  Traslape de 1 mes con ONEC.IPC.BASE_1992 en dic-2009 — ver nota en esa
  publicación para el detalle. Enero-noviembre de 2009 NO están cubiertos
  por esta serie; esos meses solo existen en BASE_1992.
  Boletín mensual narrativo (con nota metodológica y gráficos, ej. abril
  2025) publicado aparte en onec.bcr.gob.sv/indice-de-precios-al-consumidor-ipc/
  — ese archivo de boletines solo llega hasta 2015 en adelante, pero esa
  limitación es documental/narrativa, NO afecta la disponibilidad de la
  serie numérica.
  Corrección de formato (2026-08-09): las series consultadas vía el
  portal interactivo de la Base de Datos Económica y Financiera del
  BCR permiten descarga en CSV y XLSX, no solo consulta web —
  confirmado por Harold directamente contra el portal. (Excepción:
  BCR.PIB_T.SERIE_RETROPOLADA_1990_2005, que es un archivo puntual
  publicado solo en xlsx, no parte del portal interactivo — no aplica
  esta corrección a esa entrada.)

  Intento de verificación directa por Harold (2026-08-12): la URL
  https://estadisticas.bcr.gob.sv/serie/indice-de-precios-al-consumidor-ipc
  devolvió error 404 — no se pudo confirmar. Pendiente reintentar o
  localizar la URL correcta.

  RESUELTO (2026-09-16, Fase 3, captura de BCR.REMESAS.NOM.NSA.M y su
  deflactor): la misma URL, reintentada en vivo por Claude Code vía
  bcr_sondear_publicacion.R y luego con la captura real
  (src/adquisicion/bcr.R, descargar_onec_ipc_base2009()), respondió con
  normalidad: id_publicacion=48, nombre_cuadro="Índice de Precios al
  Consumidor (IPC)", unidades="Indice Diciembre 2009=100" — coincide
  exactamente con lo ya declarado en esta ficha. El 404 de agosto fue una
  falla puntual de red o del portal en ese momento, no una URL incorrecta
  ni un cambio de estructura de la fuente. Cobertura confirmada por lectura
  directa del archivo descargado: dic-2009=100 (ancla) y observaciones
  medidas hasta 2026-08 (no 2026-06 como decía la línea de
  cobertura_temporal de esta ficha, que quedó desactualizada — dato
  vigente: ver catalogos/03_series.csv, serie ONEC.IPC.IDX.NSA.M).
