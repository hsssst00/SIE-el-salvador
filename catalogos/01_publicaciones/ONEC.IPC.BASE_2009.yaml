publicacion_id: ONEC.IPC.BASE_2009
institucion_id: ONEC
nombre: "Índice de Precios al Consumidor (IPC), base diciembre 2009"
periodicidad: mensual
formato: web / csv / xlsx (Base de Datos Económica y Financiera) / pdf (boletín narrativo)
url: https://estadisticas.bcr.gob.sv/serie/indice-de-precios-al-consumidor-ipc
cobertura_temporal: "dic-2009 (mes base, índice=100 por construcción, compartido con el último dato de BASE_1992) + observaciones medidas de 2010-01 a 2026-06 (verificado)."
condiciones_uso: "No verificado — pendiente relevamiento (ADR-008)."
notas: |
  Serie vigente. Producida originalmente por DIGESTYC, heredada por ONEC.
  Serie numérica alojada en el dominio del BCR (igual que BASE_1992), no
  en onec.bcr.gob.sv. Metodología: Laspeyres (Young) + media geométrica,
  ~12,000 precios/mes, canasta actualizada con encuesta 3T2005-3T2006,
  manual OIT/FMI 2006.
  Traslape de 1 mes con ONEC.IPC.BASE_1992 en dic-2009 — ver nota en esa
  publicación para el detalle. Enero-noviembre de 2009 NO están cubiertos
  por esta serie; esos meses solo existen en BASE_1992.
  Boletín mensual narrativo (con nota metodológica y gráficos, ej. abril
  2025) publicado aparte en onec.bcr.gob.sv/indice-de-precios-al-consumidor-ipc/
  — ese archivo de boletines solo llega hasta 2015 en adelante, pero esa
  limitación es documental/narrativa, NO afecta la disponibilidad de la
  serie numérica.
  Corrección de formato (2026-08-09): las series consultadas vía el
  portal interactivo de la Base de Datos Económica y Financiera del
  BCR permiten descarga en CSV y XLSX, no solo consulta web —
  confirmado por Harold directamente contra el portal. (Excepción:
  BCR.PIB_T.SERIE_RETROPOLADA_1990_2005, que es un archivo puntual
  publicado solo en xlsx, no parte del portal interactivo — no aplica
  esta corrección a esa entrada.)
