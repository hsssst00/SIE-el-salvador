periodicidad: mensual
formato: web / csv / xlsx
url: https://estadisticas.bcr.gob.sv/serie/indice-de-precios-al-productor-ipp
cobertura_temporal: "ene-2009 a jun-2026, verificado por Harold directamente contra el portal (2026-08-09)."
