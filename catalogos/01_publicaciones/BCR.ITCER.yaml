publicacion_id: BCR.ITCER
institucion_id: BCR
nombre: "Índice de Tipo de Cambio Efectivo Real (ITCER) — serie mensual"
periodicidad: mensual
formato: web / csv / xlsx
url: https://estadisticas.bcr.gob.sv/serie/indice-de-tipo-de-cambio-efectivo-real-mensual
cobertura_temporal: "ene-2000 a jun-2026, verificado por Harold directamente contra el portal (2026-08-09)."
condiciones_uso: "En gestión, no por relevamiento pendiente (ADR-008, enmienda 2026-08-12): consulta formal enviada al BCR el 2026-08-07, ampliada el 2026-08-12 a solicitud de la propia institución; fecha de corte 2026-10-12. Aplica mientras tanto el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Cronología completa y consecuencias del vencimiento sin respuesta en ADR-008."
notas: |
  Fuente: BCR. Relevante pese a la dolarización de El Salvador (2001):
  mide competitividad cambiaria ponderada por comercio frente a socios
  comerciales, no un tipo de cambio bilateral literal — no es una
  variable trivial/constante como podría asumirse de una economía
  dolarizada.
