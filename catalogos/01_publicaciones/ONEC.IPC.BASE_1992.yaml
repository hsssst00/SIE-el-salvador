publicacion_id: ONEC.IPC.BASE_1992
institucion_id: ONEC
nombre: "Índice de Precios al Consumidor (IPC), base diciembre 1992"
periodicidad: mensual
formato: web / csv / xlsx (Base de Datos Económica y Financiera)
url: https://estadisticas.bcr.gob.sv/serie/indice-de-precios-al-consumidor-ipc-base-dic-1992-periodo-dic-1992-dic-2009
cobertura_temporal: "dic-1992 (mes base, índice=100 por construcción, no observación independiente) + observaciones medidas de 1993-01 a 2009-12, verificado por Harold directamente contra el portal (2026-08-12): ene-1992 a nov-1992 son celdas vacías, no observaciones."
condiciones_uso: "Resuelto por decisión, no por relevamiento (ADR-008, enmienda 2026-08-18): mismo patrón que ISSS — no se persigue esclarecimiento adicional con ONEC/DIGESTYC; aplica el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Detalle y motivo por institución en ADR-008."
notas: |
  Producida originalmente por DIGESTYC (disuelta ago-2022); atribución de
  autoría estadística a ONEC como sucesora, aunque la serie numérica está
  alojada en el dominio del BCR (Base de Datos Económica y Financiera,
  Sector Real), no en onec.bcr.gob.sv.
  Traslape de 1 mes con ONEC.IPC.BASE_2009 en dic-2009 (verificado
  2026-08-09): ese mes tiene observación en ambas series — valor medido
  en BASE_1992, y simultáneamente el mes de anclaje (índice=100) de
  BASE_2009. Es la misma estructura que el traslape de 4 trimestres
  documentado para el PIB en D3/ADR-003 (año/mes compartido por
  construcción, no coincidencia de publicación) — pendiente de evaluar
  en Fase 3 si se usa para calcular un factor de enlace entre ambas
  series o si se tratan como tramos independientes.
  Corrección de formato (2026-08-09): las series consultadas vía el
  portal interactivo de la Base de Datos Económica y Financiera del
  BCR permiten descarga en CSV y XLSX, no solo consulta web —
  confirmado por Harold directamente contra el portal. (Excepción:
  BCR.PIB_T.SERIE_RETROPOLADA_1990_2005, que es un archivo puntual
  publicado solo en xlsx, no parte del portal interactivo — no aplica
  esta corrección a esa entrada.)

  Confirmado por Harold (2026-08-12) directamente contra el portal:
  los meses de ene-1992 a nov-1992 están vacíos (sin observación), no
  son ceros ni valores interpolados — relevante para Fase 3 al
  construir la serie maestra, para no confundir "sin dato" con "cero".
