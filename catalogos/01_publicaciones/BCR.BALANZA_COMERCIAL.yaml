notas: |
  Fuente: BCR. Exportaciones e importaciones agregadas, mensual —
  candidato directo al predictor "comercio mundial" que nombra §1.3 de
  la senda como determinante externo del PIB a horizontes largos.
  Existen decenas de desagregaciones adicionales por clasificación de
  producto (CIIU, CUCI, CCP, CITI, CIAS, CGCE — identificadas por
  Cowork pero no catalogadas en esta pasada, Nivel 2).
  Nota de Cowork: no existe una serie dedicada de "exportación de
  café" — el detalle está dentro del archivo de Exportaciones según
  Sistema Armonizado Rev.7 (partida 0901), no catalogado aquí, y en un
  portal COMEX separado (bcr.gob.sv/comex/) fuera del alcance del
  relevamiento.
