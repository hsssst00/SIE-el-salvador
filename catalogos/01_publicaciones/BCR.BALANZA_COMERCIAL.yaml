publicacion_id: BCR.BALANZA_COMERCIAL
institucion_id: BCR
nombre: "Balanza Comercial de Mercancías — valores, serie mensual"
periodicidad: mensual
formato: web / csv / xlsx
url: https://estadisticas.bcr.gob.sv/serie/balanza-comercial
cobertura_temporal: "ene-1994 a jun-2026, verificado por Harold directamente contra el portal (2026-08-09)."
condiciones_uso: "En gestión, no por relevamiento pendiente (ADR-008, enmienda 2026-08-12): consulta formal enviada al BCR el 2026-08-07, ampliada el 2026-08-12 a solicitud de la propia institución; fecha de corte 2026-10-12. Aplica mientras tanto el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo). Cronología completa y consecuencias del vencimiento sin respuesta en ADR-008."
notas: |
  Fuente: BCR. Exportaciones e importaciones agregadas, mensual —
  candidato directo al predictor "comercio mundial" que nombra §1.3 de
  la senda como determinante externo del PIB a horizontes largos.
  Existen decenas de desagregaciones adicionales por clasificación de
  producto (CIIU, CUCI, CCP, CITI, CIAS, CGCE — identificadas por
  Cowork pero no catalogadas en esta pasada, Nivel 2).
  Nota de Cowork: no existe una serie dedicada de "exportación de
  café" — el detalle está dentro del archivo de Exportaciones según
  Sistema Armonizado Rev.7 (partida 0901), no catalogado aquí, y en un
  portal COMEX separado (bcr.gob.sv/comex/) fuera del alcance del
  relevamiento.
