notas: |
  Producto independiente de BCR.PIB_T.INDICES_VOLUMEN_ENCADENADOS_SA (M3,
  2026-08-08): ambas variantes se publican en el mismo portal del BCR y
  comparten institución, periodicidad y cobertura, pero cada una tiene su
  propia URL y su propio archivo descargable — antes registradas bajo un
  único publicacion_id genérico, corregido para reflejar que son productos
  separados.
  Fecha de publicación de la vigente: junio de 2026.
  Acceso automatizado con dos obstáculos distintos, verificados 2026-08-07:
  (1) la URL sirve la interfaz web interactiva del portal (aplicación
  Livewire/Alpine.js), no un endpoint de archivo directo — un GET simple
  con User-Agent de navegador real devuelve la página HTML, no el xlsx;
  (2) un fetch externo simple, por separado, recibió una respuesta de
  detección de bot. Ambos hechos verificados de forma independiente por
  Claude en sesión de chat — anotar en la futura bitácora de fuentes
  frágiles de Fase 2.
  Año base de ponderación: 2005. Año de referencia del índice: 2014.
  Corrección de formato (2026-08-09): las series consultadas vía el
  portal interactivo de la Base de Datos Económica y Financiera del
  BCR permiten descarga en CSV y XLSX, no solo consulta web —
  confirmado por Harold directamente contra el portal. (Excepción:
  BCR.PIB_T.SERIE_RETROPOLADA_1990_2005, que es un archivo puntual
  publicado solo en xlsx, no parte del portal interactivo — no aplica
  esta corrección a esa entrada.)
