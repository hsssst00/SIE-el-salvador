cobertura_temporal: "Confirmada por consulta directa a la API (2026-08-15) para SLV, cruzada contra JSON crudo. Catálogo de 36 indicadores en total bajo source=15. Cobertura verificada indicador por indicador, no de forma agregada: DPANUSSPB (tipo de cambio LCU/USD) con mensualidad real confirmada 2023-2024 (total:24, formato date AAAAMnn), valor constante 8.75 (correcto, tipo fijo post-dolarización). NYGDPMKTPSACD (PIB corriente USD, SA) anual, 1990-2025 (nulos 1987-1989 y 2026 sin dato aún), 40 observaciones. REER (tipo de cambio efectivo real) SIN datos para SLV en el rango consultado — todos los valores null. No se probaron los 36 indicadores; no asumir que los no probados tienen cobertura. Última actualización de la fuente reportada por la API: 2026-03-31 (verificado 2026-08-12) — es la fecha de actualización de la fuente, no la cobertura de las series."
