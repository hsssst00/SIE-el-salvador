notas: |
  Fuente: Banco Mundial. Código de fuente en la API: GEM, id=15
  (verificado directamente por Claude contra /v2/sources, 2026-08-12).

  HALLAZGO DEL RELEVAMIENTO INICIAL, sigue vigente y es importante:
  probablemente la entrada más útil del bloque Banco Mundial. A
  diferencia de WDI, que es anual, GEM publica indicadores de coyuntura
  de frecuencia mensual y trimestral para países en desarrollo — ahora
  CONFIRMADO para al menos un indicador (ver verificación de
  periodicidad abajo). Eso lo convierte en candidato directo para senda
  §6.4 (frecuencia mixta y nowcasting), que es la extensión que la
  propia senda §9 identifica como la de mejor relación entre valor
  añadido y costo.

  QUÉ FALTA CONFIRMAR ANTES DE DARLE PESO — lista original de 4 puntos,
  actualizada con lo resuelto en esta sesión (2026-08-15):
    1. Si El Salvador está cubierto y con qué indicadores.
       RESUELTO: sí, cobertura confirmada para al menos 3 de 4
       indicadores probados (ver cobertura_temporal). No se probaron
       los 36 indicadores del catálogo completo.
    2. Qué frecuencia efectiva tienen esas series para SLV.
       RESUELTO: DPANUSSPB es mensual real, confirmado contra JSON
       crudo con el formato de fecha correcto (date=AAAAMnn:AAAAMnn).
       NYGDPMKTPSACD es genuinamente anual — confirmado con el mismo
       rigor, no asumido de una sola lectura: date=2023 y date=2024 por
       separado devuelven cada uno un valor real (33850.75 y 35353.64
       respectivamente), mientras que date=2023M01:2024M12 (formato
       mensual, la misma ventana de calendario) devuelve 24 filas
       estructuralmente válidas pero TODAS null — la API no rechaza el
       formato mensual para un indicador anual, simplemente no matchea
       la observación de período "año" contra ninguna grilla de mes, ni
       siquiera diciembre. La frecuencia varía por indicador, confirmado
       en ambos sentidos: no hay una respuesta única para "GEM" como
       fuente, y el formato de fecha usado en la consulta puede tanto
       ocultar sub-anualidad real (caso DPANUSSPB) como devolver un
       falso patrón de "sin datos" para un indicador genuinamente anual
       si se consulta con la granularidad equivocada (caso
       NYGDPMKTPSACD). Cualquier consulta futura a esta fuente debe
       probar ambos formatos de fecha antes de concluir ausencia de
       dato o de granularidad.
    3. Cuál es el rezago de publicación — un predictor mensual que
       llega con cuatro meses de retraso no sirve para nowcasting.
       RESUELTO PARCIALMENTE por Claude Code vía curl directo
       (2026-08-18), repitiendo la consulta a DPANUSSPB y NYGDPMKTPSACD
       con ventana más reciente, contra la fecha "lastupdated" que la
       API reporta para source=15 (2026-03-31, confirmado de nuevo vía
       /v2/sources/15):
         - DPANUSSPB (mensual): el último valor real es 2026M03, el
           mismo mes que "lastupdated" — rezago aparente ≈ 0. Pero el
           hallazgo NO es informativo sobre el rezago real de GEM: es un
           tipo de cambio fijo post-dolarización (8.75 constante en
           todos los meses consultados, 2025M01-2026M03), conocido de
           antemano sin necesidad de reportar nada — no sirve como
           prueba de qué tan rápido GEM publica un dato que sí cambia.
         - NYGDPMKTPSACD (anual): el último valor real es el año 2025
           (27,700.44; el año 2026 aparece con value=null). Contra
           "lastupdated"=2026-03-31, el rezago es de aproximadamente
           tres meses desde el cierre del año calendario 2025 — rezago
           típico de una cifra de PIB anual, ni mejor ni peor que otras
           fuentes anuales ya catalogadas.
         Conclusión operativa: con los dos únicos indicadores
         verificados hasta ahora no se pudo aislar el rezago de un
         indicador GEM genuinamente de alta frecuencia y variable — el
         único mensual probado es un caso degenerado (tipo de cambio
         fijo). Para responder la pregunta original ("un predictor
         mensual con cuatro meses de rezago no sirve para nowcasting")
         hace falta repetir este mismo procedimiento sobre un indicador
         mensual o trimestral de GEM que sí tenga variación real para
         SLV — no evaluado todavía, y no se puede generalizar desde
         DPANUSSPB.
    4. Si los indicadores de GEM para El Salvador son retransmisión de
       fuentes que el proyecto ya cataloga (BCR, ONEC) o agregan
       información propia. Si es lo primero, el valor cae a contraste
       de consistencia — mismo patrón que se encontró en FMI.QNEA y en
       FMI.BOP.
       RESUELTO PARCIALMENTE por Claude Code (2026-08-18), comparación
       elegida por Harold vía pregunta directa: NYGDPMKTPSACD (GEM, PIB
       corriente USD, SA) contra la suma de los cuatro trimestres de
       "Producto Interno Bruto trimestral por el enfoque de la
       producción" en el archivo L0 ya descargado
       data/L0_raw/BCR_pib_t_nominal_2026-08-15.xlsx (cifra idéntica,
       verificado en el mismo archivo, a la fila equivalente por el
       enfoque del gasto — consistencia interna del propio archivo BCR).
       Resultado, año por año (GEM vs. BCR, millones USD):
         2019: 26,878.99 vs 26,881.13 (-0.008%)
         2020: 24,918.34 vs 24,921.19 (-0.011%)
         2021: 29,032.78 vs 29,043.14 (-0.036%)
         2022: 31,871.83 vs 31,870.11 (+0.005%)
         2023: 33,850.75 vs 33,565.43 (+0.850%)
         2024: 35,353.64 vs 34,879.73 (+1.359%)
         2025: 27,700.44 vs 36,708.10 (-24.539%)
       LECTURA: 2019-2022 coinciden casi exactamente (diferencias
       <0.04%) — evidencia fuerte de que GEM retransmite la cifra del
       BCR para esos años, no una medición propia. 2023-2024 divergen
       un poco más (0.85% y 1.36%) pero siguen siendo consistentes con
       retransmisión de una revisión anterior no actualizada — mismo
       patrón de rezago que ya señala el punto 3 de esta lista. 2025 es
       la excepción que no encaja en "solo rezago": la brecha es de
       24.5%, un orden de magnitud mayor que cualquier otro año, y en
       dirección de que GEM reporta MENOS PIB que el BCR, no más (lo
       esperable si GEM simplemente no hubiera incorporado revisiones
       al alza). CAVEAT que atenúa pero no explica la magnitud: el
       propio archivo BCR marca los cuatro trimestres de 2025 como
       cifras "(e) Estimadas" —la calificación menos firme de las tres
       que usa el BCR (r=revisada, p=preliminar, e=estimada)— así que
       ni el numerador (GEM) ni el denominador (BCR) de esta
       comparación para 2025 son cifras cerradas. No se determinó la
       causa exacta de la brecha de 2025 (¿el valor de GEM no es en
       realidad el año calendario completo? ¿usa otra base o método de
       agregación trimestral distinto al BCR?) — pendiente si esta
       fuente llega a evaluarse en serio como candidata de modelación.
       Conclusión operativa: para años ya consolidados, GEM SÍ es
       retransmisión del BCR y no aporta información propia — confirma
       la hipótesis que motivó este punto. Para el año más reciente
       disponible, GEM no debe tratarse como equivalente al BCR sin
       investigar antes la brecha.

  PARÁMETROS DE CONSULTA — hallazgo importante verificado el 2026-08-15,
  con controles cruzados (curl directo, JSON crudo revisado por Claude
  chat, no solo por Claude Code):

    - El parámetro que controla la granularidad temporal real de la
      respuesta es el FORMATO del string pasado a `date`, no el
      parámetro `frequency`.
    - `date=AAAA:AAAA` (rango de años planos) devuelve UN punto por año
      calendario, con el campo `date` también en formato año plano
      ("2024", "2023"), AUNQUE la serie subyacente sea mensual. Probado
      con DPANUSSPB: date=2023:2024 devolvió total:2 (un valor por año).
    - `date=AAAAMnn:AAAAMnn` (rango de meses) devuelve la mensualidad
      real: mismo indicador DPANUSSPB, mismo rango de calendario
      (2023-2024), devolvió total:24 con `date` en formato "2024M12",
      "2024M11", etc.
    - El parámetro `frequency=M` se probó explícitamente contra el
      formato de años planos: la API lo acepta con HTTP 200, SIN error,
      pero lo ignora en silencio — la respuesta fue idéntica byte por
      byte con y sin ese parámetro. Es un gotcha grave para Fase 2: un
      script que confíe en `frequency=M` para pedir mensualidad va a
      recibir datos anuales sin ningún aviso de que la granularidad
      pedida no se cumplió. La forma correcta es controlar la
      granularidad exclusivamente por el FORMATO del string de `date`.
    - Análogo al gotcha ya documentado en FMI.QNEA.yaml (SDMX 2.1 vs
      3.0, startPeriod/endPeriod ignorados en silencio) — mismo patrón
      de fuente que acepta un parámetro sin aplicarlo, sin error visible.
    - GOTCHA INVERSO, confirmado el mismo día: consultar un indicador
      que SÍ es genuinamente anual (NYGDPMKTPSACD) con formato mensual
      (date=AAAAMnn:AAAAMnn) NO da error — devuelve filas
      estructuralmente válidas (una por mes solicitado) pero con
      `value: null` en las 24, incluido diciembre de cada año, que sería
      el lugar más esperable si la API "estampara" el valor anual en
      algún mes. Confirmado que no es hueco de cobertura: los mismos dos
      años, consultados en formato año (date=2023 y date=2024 por
      separado), devuelven cada uno un valor real. Conclusión operativa
      para Fase 2: un script que solo pruebe un formato de fecha puede
      concluir "sin datos" para un indicador anual consultado en
      formato mes, o "sin datos sub-anuales" para un indicador mensual
      consultado en formato año — ambos falsos negativos, mismo origen.
      La única forma confiable de determinar la granularidad real de un
      indicador de GEM es probar ambos formatos antes de concluir.

  Cobertura por indicador NO es pareja: de los 4 indicadores probados
  (de 36 totales en el catálogo GEM), uno (REER) no tiene ningún dato
  para SLV. Cualquier registro futuro de series individuales de esta
  publicación en 03_series debe verificar cobertura indicador por
  indicador, no asumir que el 100% del catálogo GEM aplica a El
  Salvador solo porque la fuente en general sí tiene cobertura.

  Relevamiento externo de Claude vía web (2026-08-12), sin Cowork;
  verificación de cobertura y periodicidad por Claude Code vía curl
  directo, cruzada contra JSON crudo por Claude chat (2026-08-15).
  Pendiente verificación directa de Harold contra la API.

  Datos adicionales confirmados en la misma consulta (2026-08-17):
  la página oficial declara periodicidad "Day" (diaria) para el
  conjunto del dataset — más alta que lo observado para El Salvador en
  los indicadores probados en esta sesión, consistente con que la
  granularidad real varía mucho por indicador, no por la fuente en
  general. También declara cobertura_temporal "1990 - 2023" —
  NO 2026 — pese a que la metadata del dataset se actualizó
  recientemente (Jul 22, 2026). Es la misma señal de rezago que se
  encontró independientemente en BID.LATIN_MACRO_WATCH (fecha de
  "actualizado" del paquete no garantiza que los datos del país estén
  al día) — vale la pena cruzar ambos hallazgos si se evalúa esta
  fuente para nowcasting (senda §6.4).
