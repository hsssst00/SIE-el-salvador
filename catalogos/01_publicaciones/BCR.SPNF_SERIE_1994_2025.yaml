notas: |
  Fuente: BCR. Antecesora de BCR.SPNF_VIGENTE (serie desde ene-2020) —
  mencionada en la nota de esa publicación pero no catalogada por
  separado hasta ahora. Nota metodológica propia del BCR: desde ene-1994
  los ingresos tributarios brutos se ajustan excluyendo devoluciones de
  ISR e IVA (ingresos tributarios netos).
  A partir de ene-2025 la serie VIGENTE incorpora flujos del Instituto
  Salvadoreño de Pensiones (ISP); el tramo 2023-2024 de ESTA serie NO
  incluye esas transacciones — diferencia de alcance conceptual entre
  ambas series, no solo de ventana temporal. Ver 09_rupturas.csv, R013.
  Identificado vía búsqueda externa por Claude (2026-08-11), no vía
  Cowork ni verificación directa de Harold contra el portal.
