cobertura_temporal: "Confirmado por Claude Code (2026-08-18) vía GET directo a fred/series/observations para cada uno de los 4 códigos candidatos, por separado (ficha deliberadamente genérica, según su propia nota — no se elige uno solo): INDPRO 1919-01-01 a 2026-07-01, 1291 observaciones mensuales, todas con valor; PAYEMS 1939-01-01 a 2026-07-01, 1051 observaciones, todas con valor; UNRATE 1948-01-01 a 2026-07-01, 943 observaciones, 942 con valor — falta exactamente 2025-10-01; CPIAUCSL 1947-01-01 a 2026-07-01, 955 observaciones, 954 con valor — falta exactamente 2025-10-01. El hueco puntual y coincidente en UNRATE y CPIAUCSL (ambas de fuentes ligadas al gobierno federal de EE.UU. — BLS) en el mismo mes es consistente con el aviso de interrupción presupuestaria del gobierno de EE.UU. ya registrado en la ficha FRED.BEA_PIB_EEUU (esa fecha de aviso no se había podido fijar antes; este hueco la ancla aproximadamente a octubre de 2025), aunque no se confirmó la causa de forma directa contra un aviso oficial de FRED o BLS — queda como hipótesis razonable, no como hecho verificado."
condiciones_uso: "Idénticas a FRED.BEA_PIB_EEUU — ver esa entrada. Atención especial al punto de copyright de terceros: FRED redistribuye series de decenas de fuentes y algunas son de propiedad privada. Antes de incorporar cualquier serie concreta debe verificarse si su campo de notas contiene la marca de copyright. Pendiente verificación directa de Harold."
notas: |
  Fuentes ORIGINALES: mayoritariamente Bureau of Labor Statistics (BLS)
  y Junta de Gobernadores del Sistema de la Reserva Federal. Canal de
  acceso: FRED.

  Justificación: senda §6.4 (frecuencia mixta y nowcasting) señala que
  ignorar la frecuencia mensual desperdicia la principal ventaja
  informativa del sistema. Los predictores mensuales estadounidenses
  son el complemento externo natural de los predictores mensuales
  salvadoreños ya catalogados (IVAE, IPI, remesas, comercio exterior).

  Series candidatas identificadas por Claude, códigos NO verificados
  contra la API:
    - INDPRO — producción industrial
    - PAYEMS — empleo no agrícola en nómina
    - UNRATE — tasa de desempleo
    - CPIAUCSL — índice de precios al consumidor
    - Índices de precios de importación y exportación (BLS)

  ADVERTENCIA DE ALCANCE: esta entrada es deliberadamente genérica
  porque el conjunto definitivo de predictores mensuales estadounidenses
  no está fijado y no debe fijarse acá. La construcción de la matriz de
  predictores es entregable de Fase 3 (senda §4). Lo que corresponde a
  Fase 1 es dejar constancia de que la fuente existe, es accesible por
  API y tiene condiciones de uso conocidas. La selección concreta de
  series se hace después, con criterio explícito, y se registra en
  03_series.

  Relevamiento externo de Claude vía web (2026-08-12), sin Cowork.
  Pendiente verificación directa de Harold contra la API.
