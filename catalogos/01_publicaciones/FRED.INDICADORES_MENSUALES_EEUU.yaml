institucion_id: FRED
nombre: "Indicadores mensuales de actividad, empleo y precios de Estados Unidos, redistribuidos por FRED — ficha de familia"
periodicidad: mensual
formato: api (REST; JSON o XML)
url: https://api.stlouisfed.org/fred/series/observations
cobertura_temporal: "No aplica a esta ficha directamente — ver la cobertura de cada serie en su propia ficha (FRED.INDPRO, FRED.PAYEMS, FRED.UNRATE, FRED.CPIAUCSL)."
condiciones_uso: "API key gratuita obligatoria (fredaccount.stlouisfed.org); cada usuario debe usar su propia clave, por lo que la clave NO puede comprometerse al repositorio. Los Términos de Uso de la API de FRED imponen dos obligaciones activas verificadas por Claude (2026-08-12): (i) colocar de forma prominente en la aplicación el aviso de que el producto usa la API de FRED pero no está avalado ni certificado por el Federal Reserve Bank of St. Louis; (ii) no afirmar ni sugerir respaldo institucional, y no usar marcas ni logos del banco. Además, las series accesibles vía FRED pueden pertenecer a terceros y estar sujetas a copyright que FRED no puede levantar — las series con copyright llevan la palabra Copyright en su campo de notas y son identificables por búsqueda. Se aplica el default conservador de ADR-008. Pendiente verificación directa de Harold."
notas: |
  RE-ENCUADRADA (2026-08-27) — ver doc/adr/ADR-007-politica-vintages.md, nota de
  seguimiento 2026-08-27. Esta ficha YA NO es objetivo de captura: cada serie
  individual (FRED.INDPRO, FRED.PAYEMS, FRED.UNRATE, FRED.CPIAUCSL) tiene su
  propia ficha, propio publicacion_id, propios vintages. Motivo de la partición:
  cada series_id de FRED es su propio flujo de publicación, con calendario de
  divulgación y realtime_start nativo independientes — un publicacion_id
  compartido producía colisión de vintage_id cuando dos o más series se
  capturaban el mismo mes.

  Esta ficha documenta el contexto compartido del grupo: condiciones de uso
  (ver arriba), justificación en el proyecto (senda §6.4, frecuencia mixta y
  nowcasting — ignorar la frecuencia mensual desperdicia la principal ventaja
  informativa del sistema), y sirve de punto de entrada para localizar las
  fichas individuales. Las series de precios de importación/exportación (BLS)
  mencionadas en la investigación original siguen sin ficha propia — candidatas
  futuras, mismo patrón de partición si se incorporan.

  Distinción que se mantiene igual que antes de la partición: capturar L0 de una
  serie candidata (Fase 2, lo que hace este handoff) NO es lo mismo que
  seleccionarla como predictor del modelo (Fase 3, se registra en 03_series). La
  partición del publicacion_id no compromete nada sobre qué series terminan
  siendo predictores.

  Relevamiento externo de Claude vía web (2026-08-12), sin Cowork. Pendiente
  verificación directa de Harold contra la API.
