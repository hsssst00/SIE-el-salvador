nombre: "Demanda Total de Electricidad (GWh) — serie mensual"
periodicidad: mensual
formato: "html / pdf / xls / csv (formulario de reportes, salida seleccionable por el usuario)"
url: "https://www.ut.com.sv/reportes?p_p_id=MenuReportesEstadisticosPublicReports_WAR_PublicReports&p_p_lifecycle=1&p_p_state=normal&p_p_mode=view&_MenuReportesEstadisticosPublicReports_WAR_PublicReports_reportName=14utdemtotal"
cobertura_temporal: "Dato subyacente existe desde 1998 (confirmado por Harold: la vista embebida/html muestra valores mensuales para 1998-2001). Pero TODA exportación a archivo estructurado falla para esos 4 años — confirmado por Harold: CSV, PDF y XLS salen vacíos/fallan para 1998, 1999, 2000 y 2001; funcionan con normalidad desde 2002 en adelante. Solo la vista embebida (html en pantalla) muestra el dato de esos años — no hay ningún formato de archivo descargable que lo traiga. Rango capturable como archivo (CSV, confirmado por Harold como archivo real descargable): 2002-2026, 25 archivos (2002.csv-2026.csv), verificados exhaustivamente por Harold — 2002-2025 completos (12 meses, numéricos, sin duplicados), 2026 parcial (enero-julio). 1998-2001 quedan como HUECO EN TODO FORMATO CAPTURABLE COMO ARCHIVO, no en el dato subyacente — pendiente decisión de Harold: transcribir manualmente desde la vista embebida (única fuente disponible para esos años, de menor calidad evidencial que un archivo con checksum) o dejar 1998-2001 fuera de L0 por ahora. El formulario trae UN AÑO POR CONSULTA."
condiciones_uso: "No verificado — pendiente relevamiento (ADR-008). Institución nueva para el proyecto (agregada 2026-08-26), sin consulta enviada todavía. Aplica el default conservador de ADR-008 (script + checksum, sin comprometer el archivo crudo) hasta que se relevance."
notas: |
  Fuente: Unidad de Transacciones, S.A. de C.V. (UT), administrador del Mercado
  Mayorista de Electricidad de El Salvador. Candidata al predictor mensual
  "energía" que la senda §6.4 nombra explícitamente y que, hasta este
  hallazgo, se había dado por no disponible (ver
  doc/relevamiento_predictores_energia_turismo.md).

  Mecanismo de captura: el formulario ("Formulario Reportes Estadisticos",
  selector de Año + selector de salida embebido/html/pdf/xls/csv + botón
  "ejecutar") es un generador de reportes parametrizado, NO un componente
  vista-serie como la familia BCR — no se puede reusar bcr_captura.R sin
  adaptación. El dominio completo (ut.com.sv) bloquea acceso automatizado:
  confirmado dos veces — web_fetch de Claude chat (ROBOTS_DISALLOWED) y
  formalmente con `polite::scrape()` (2026-08-26,
  src/adquisicion/verificar_robots_ut.R): "The path is not scrapable for
  this user-agent" tanto para el dominio base como para la ruta del
  reporte; scrape() se negó a continuar sin force=TRUE. La captura queda
  sujeta a la Regla 9 de CLAUDE.md, igual que
  BCR.PIB_T.SERIE_RETROPOLADA_1990_2005: manual, sin scripts de descarga
  desatendidos, con independencia de que existan herramientas (chromote)
  capaces de evadir técnicamente el bloqueo — decisión de Harold,
  2026-08-20, ya aplicada acá sin excepción.

  Estructura confirmada por captura de pantalla de Harold (2026-08-26):
  tabla de dos columnas, "MES" | "GWH", una fila por mes del año
  seleccionado (ej. Enero 576.03, Febrero 522.86, ... Julio 689.48 para
  2026). Confirmado por Harold: el formulario trae UN AÑO POR CONSULTA —
  no hay opción de rango multi-año.

  CORRECCIÓN DE COBERTURA (Harold, 2026-08-26, verificación exhaustiva
  archivo por archivo — no una muestra) — TERCERA CORRECCIÓN, cada vez
  más precisa: no es que 1998-2001 carezcan de dato. Harold confirmó
  que la salida "embebido" (html) SÍ muestra valores mensuales para esos
  cuatro años — el dato subyacente existe. Lo que falla es **toda
  exportación a archivo estructurado**: Harold probó CSV, PDF y XLS para
  1998-2001, y los tres formatos fallan/salen vacíos. Solo queda la
  vista en pantalla como fuente disponible para esos años. Desde 2002 en
  adelante, CSV funciona con normalidad (no se re-probaron PDF/XLS para
  2002+, dado que CSV ya resuelve la necesidad).

  Confirmado por Harold: existen exactamente 25 archivos CSV con datos
  reales, `2002.csv` a `2026.csv`. De ellos, 2002-2025 (24 años)
  completos — 12 meses, todos numéricos, sin duplicados. `2026.csv`
  trae solo enero-julio (año en curso). "Salida csv" confirmada como
  archivo real descargable, no solo un cambio de render en pantalla.

  DECISIÓN PENDIENTE (Harold): qué hacer con 1998-2001, dado que NINGÚN
  formato de archivo los exporta (opción de "probar otro formato" ya
  agotada). Dos caminos, sin resolver acá: (a) transcribir manualmente
  los 4 años (48 valores mensuales) desde la vista embebida, con una
  nota epistémica clara de que el origen es transcripción de pantalla,
  no archivo descargado — más propenso a error humano, sin el tipo de
  trazabilidad hacia el archivo publicado que exige el principio de L0;
  (b) dejar 1998-2001 fuera de L0 por ahora, documentado como hueco de
  formato capturable (no de dato subyacente), revisable más adelante si
  UT llega a corregir su mecanismo de exportación para años antiguos.

  ANOMALÍA DE CODIFICACIÓN, confirmada por Harold (2026-08-26): en
  `2002.csv` y `2003.csv`, el campo interno "Año" del propio archivo
  aparece vacío o con problemas de codificación — el nombre del archivo
  es la única forma confiable de identificar a qué año corresponde esos
  dos casos. Desde `2004.csv` en adelante, el año interno SÍ coincide
  con el nombre del archivo. Implicación para cualquier parser: **nunca
  confiar en el campo "Año" interno del CSV para identificar el año —
  usar siempre el nombre del archivo**, ya que falla precisamente en los
  dos primeros años de la serie.

  Formato del CSV real (NO la vista embebida limpia que mostraban las
  primeras capturas de pantalla) — confirmado por Harold sobre 2002:
  trae filas de metadata del layout original ANTES del encabezado de
  datos (nombre de la institución, "Año: NNNN" — o vacío/corrupto en
  2002-2003, ver arriba —, "Fecha y hora del Reporte", una fila en
  blanco) — cualquier parser debe saltar esas filas, no asumir que la
  fila 1 es el encabezado "MES,GWH".

  URL confirmada por Harold (2026-08-26) — es un portlet Liferay
  (`p_p_id=MenuReportesEstadisticosPublicReports_WAR_PublicReports`), no
  un endpoint REST simple; el parámetro `reportName=14utdemtotal`
  identifica este reporte específico dentro del portal — sugiere que
  otros reportes del mismo menú (p. ej. Precios) tienen su propio código
  de `reportName`, útil si se investigan más adelante.

  CONFIRMADO por Harold (2026-08-26, segunda captura): al ejecutar la
  consulta (año 2026, salida embebido) la URL resultante es
  `https://www.ut.com.sv/reportes?p_p_id=FormularioReportesEstadisticosPublicReports_WAR_PublicReports&p_p_lifecycle=1&p_p_state=normal&p_p_mode=view&_FormularioReportesEstadisticosPublicReports_WAR_PublicReports_action=rendReport`
  — portlet DISTINTO (`Formulario...`, no `Menu...`), sin año ni formato
  de salida visibles como parámetros de la URL. Confirma que año/salida
  se envían por POST al presionar "ejecutar", no por query string — un
  enlace simple con parámetros no alcanza para reproducir una consulta
  específica; hace falta interacción real con el formulario (selects +
  envío), consistente con `p_p_lifecycle=1` (acción de portlet Liferay,
  no una vista GET simple). Esto no es negociable para la manualidad de
  la captura: aunque `robots.txt` no bloqueara el dominio (y de hecho lo
  bloquea, verificado), la mecánica del formulario en sí ya exige clicks
  reales, no solo una URL armada.

  Pendiente antes de cualquier captura real: (1) decidir entre
  transcripción manual o exclusión para 1998-2001 (ver "DECISIÓN
  PENDIENTE" arriba — ya no hay una tercera opción de "probar otro
  formato", los tres se probaron y fallan); (2) decidir si esta
  publicación entra a L0 con el mismo tratamiento manual que la
  retropolada (captura puntual, sin recaptura automatizada) o si
  amerita algún mecanismo semi-manual distinto dado que sí se actualiza
  mes a mes (a diferencia de la retropolada, que es serie cerrada) — 25
  archivos CSV ya descargados por Harold (2002-2026) más lo que se
  decida para 1998-2001; (3) escribir el parser del CSV real respetando
  las filas de metadata previas al encabezado, la anomalía de 2002/2003
  (usar siempre el nombre del archivo para el año, nunca el campo
  interno), y el posible problema de encoding en esos dos archivos.

  Candidata adicional identificada, NO catalogada en esta pasada: "Precios"
  dentro del mismo menú de Reportes Estadísticos — misma presentación
  (un año por consulta, mismos formatos de exportación), con DOS tipos
  de medición ("oficial" e "indicativa", sin verificar la diferencia
  exacta entre ambas). Sería el predictor de precio de energía,
  complementario a esta serie de cantidad (demanda). Otras secciones del
  menú ("TBM: Transacciones Bilaterales Mensuales" también declara
  mensual en el nombre; el resto — ofertas MRS, transacciones horarias,
  niveles de embalse — es operación de mercado de grano fino, poco
  relevante como predictor macroeconómico agregado) tampoco evaluadas.
