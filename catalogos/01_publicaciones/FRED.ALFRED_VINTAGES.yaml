publicacion_id: FRED.ALFRED_VINTAGES
institucion_id: FRED
nombre: "ALFRED — archivo de vintages con historial de revisiones de series económicas"
periodicidad: continua
formato: api (REST; JSON o XML)
url: https://alfred.stlouisfed.org
cobertura_temporal: "Confirmado por Claude Code (2026-08-18) vía GET directo a fred/series/vintagedates?series_id=GDPC1 (serie de referencia, PIB real de EE.UU.): 417 fechas de vintage archivadas, desde 1991-12-04 hasta 2026-07-30. Es decir, ALFRED archiva vintages de GDPC1 desde fines de 1991 — casi 35 años de historial de revisiones para esta serie puntual. No se probó si otras series tienen la misma profundidad de archivo; no asumir que 1991 es el arranque general de ALFRED."
condiciones_uso: "Idénticas a FRED.BEA_PIB_EEUU — ver esa entrada. Pendiente verificación directa de Harold."
notas: |
  Fuente: Federal Reserve Bank of St. Louis. Producto PROPIO de FRED,
  no una redistribución — es la excepción dentro de las entradas FRED.

  ES LA ENTRADA MÁS RELEVANTE DE ESTE BLOQUE PARA EL DISEÑO DEL SIE, y
  no por los datos que contiene sino por lo que documenta.

  Relevancia para D7 (política de versiones de publicación), que la
  senda §2 califica como la decisión que más valor agrega al proyecto:
  ALFRED es una implementación en producción, madura y consultable, de
  exactamente el diseño bitemporal que el proyecto se propone construir
  — cada observación indexada por período de referencia y por fecha de
  publicación. Vale la pena examinar cómo modela el concepto de período
  en tiempo real (real-time period) y qué expone el endpoint
  fred/series/vintagedates, ANTES de cerrar el diseño de 08_vintages.
  El costo de mirarlo es bajo; el costo de descubrir tarde que el
  modelo de datos propio no soporta un caso que ALFRED sí resuelve es
  alto, porque la senda §2 (D7) ya advierte que añadir la dimensión de
  vintage después obliga a rehacer el modelo de datos completo.

  Relevancia para senda §5.5 (evaluación en tiempo real): si se usan
  predictores estadounidenses en los modelos, evaluarlos contra sus
  series revisadas más recientes reintroduce por la puerta de atrás
  exactamente el sesgo que el diseño bitemporal busca eliminar para la
  variable objetivo. ALFRED permite recuperar el vintage disponible en
  cada origen de pronóstico también para los predictores externos.
  Esto NO está contemplado en ADR-007, que acotó la reconstrucción
  retrospectiva de vintages al período SCN 2008 y al caso BCR. Es una
  extensión de alcance que debe decidirse explícitamente, no asumirse.

