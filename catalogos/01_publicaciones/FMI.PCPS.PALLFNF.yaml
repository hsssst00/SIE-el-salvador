publicacion_id: FMI.PCPS.PALLFNF
institucion_id: FMI
nombre: "All Commodity Price Index excl. Fuel (PALLFNF), Primary Commodity Price System"
periodicidad: mensual
formato: api (SDMX 3.0; JSON o XML)
url: https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/PCPS/+/G001.PALLFNF.INDEX.M
cobertura_temporal: "Confirmado por Claude Code (2026-08-18, re-confirmado 2026-08-28): 1992-M01 a 2026-M07, 415 observaciones mensuales continuas, sin huecos."
condiciones_uso: "Idénticas a las de FMI.PCPS.yaml (ficha de familia) y FMI.WEO.yaml — ver esa ficha para el texto completo (todos los derechos reservados, reuso libre no comercial con cita obligatoria, default conservador de ADR-008). No repetido acá para evitar duplicación (senda §10.6)."
notas: |
  Fuente: FMI, Departamento de Investigación (agencia SDMX IMF.RES),
  dataflow PCPS. Índice de todos los commodities excluyendo combustibles
  (alimentos, bebidas, materias primas agrícolas, metales), transformación
  INDEX, frecuencia mensual.

  Publicación individual desprendida de FMI.PCPS (ficha de familia) — un
  publicacion_id por indicador desde el inicio (ADR-007, nota de seguimiento
  2026-08-27, aplicado preventivamente: los candidatos de PCPS comparten
  dataflow y fecha de refresco, colisionarían en vintage_id bajo una ficha
  común igual que FRED.INDICADORES_MENSUALES_EEUU).

  fecha_publicacion: fecha bisecada del parámetro SDMX `updatedAfter` — PCPS
  no trae fecha de dato legible (diagnóstico 2026-08-28). Ver src/adquisicion/fmi.R
  y la nota homóloga en FMI.PCPS.yaml.

  Uno de los 3 candidatos de arranque de PCPS (con POILAPSP y PFOOD),
  elegidos por categorías de shock distintas sin redundancia entre sí.
