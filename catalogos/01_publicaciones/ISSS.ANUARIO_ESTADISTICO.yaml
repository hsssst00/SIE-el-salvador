cobertura_temporal: "1959 a 2021 (serie moderna 2014-2021; serie histórica con años sueltos: 1959, 1990, 2000, 2010, 2017...). Último disponible: Anuario 2021, subido 23-sep-2024. Relevamiento Cowork (2026-08-12), pendiente verificación directa de Harold."
condiciones_uso: "No verificado — pendiente relevamiento (ADR-008). Decisión de Harold (2026-08-17): no se persigue esclarecimiento adicional con el ISSS — narrativa completa (discontinuación, reserva de información LAIP, costo $0.04/página) en 09_rupturas.csv R014_ISSS_ESTADISTICAS_RESERVA y en la fila ISSS de 00_instituciones.csv."
notas: |
  Fuente: ISSS. Secundario para el proyecto (cobertura anual, no
  mensual) pero catalogado por completitud. El archivo del Anuario 2021
  se llama literalmente "Anuario_2021_redacted.pdf" — el sufijo es
  coherente con la nota aclaratoria de reserva de información de
  nov-2024 (ver 09_rupturas.csv R014), aunque no se ha comparado contra
  ediciones anteriores para determinar qué contenido específico se
  removió. Faltan los anuarios 2022, 2023, 2024 y 2025.
