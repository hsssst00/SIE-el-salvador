publicacion_id: FMI.PCPS.POILAPSP
institucion_id: FMI
nombre: "Average Petroleum Spot Price (POILAPSP), Primary Commodity Price System"
periodicidad: mensual
formato: api (SDMX 3.0; JSON o XML)
url: https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/PCPS/+/G001.POILAPSP.INDEX.M
cobertura_temporal: "Confirmado por Claude Code (2026-08-28) vía captura real: 1992-M01 a 2026-M07, observaciones mensuales continuas (misma estructura y rango que PALLFNF.INDEX.M, ya verificada por la ficha de familia)."
condiciones_uso: "Idénticas a las de FMI.PCPS.yaml (ficha de familia) y FMI.WEO.yaml — ver esa ficha para el texto completo (todos los derechos reservados, reuso libre no comercial con cita obligatoria, default conservador de ADR-008). No repetido acá para evitar duplicación (senda §10.6)."
notas: |
  Fuente: FMI, Departamento de Investigación (agencia SDMX IMF.RES),
  dataflow PCPS. Petróleo crudo, promedio spot (APSP — average of Brent,
  WTI y Dubai Fateh), transformación INDEX, frecuencia mensual.

  Publicación individual desprendida de FMI.PCPS (ficha de familia) — un
  publicacion_id por indicador desde el inicio (ADR-007, nota de seguimiento
  2026-08-27, aplicado preventivamente: los candidatos de PCPS comparten
  dataflow y fecha de refresco, colisionarían en vintage_id bajo una ficha
  común igual que FRED.INDICADORES_MENSUALES_EEUU).

  fecha_publicacion: fecha bisecada del parámetro SDMX `updatedAfter` — PCPS
  no trae fecha de dato legible (diagnóstico 2026-08-28). Ver src/adquisicion/fmi.R
  y la nota homóloga en FMI.PCPS.yaml.

  Arranque con 3 de los ~10 candidatos de PCPS, eligiendo categorías de shock
  distintas sin redundancia entre sí: petróleo (este código), todos los
  commodities sin combustible (PALLFNF), alimentos (PFOOD). Los otros
  benchmarks de crudo (POILBRE, POILDUB, POILWTI, POPEC) se dejan fuera por
  redundancia con este; PFANDB/PNFUEL/PVOIL quedan como candidatos futuros.

  Nota (2026-10-19, Fase 6): esta serie es un índice y no el precio en
  dólares que proyecta el WEO; de 2015 a 2025 su crecimiento anual difiere
  del de G001.POILAPSP del WEO entre −3,4 y +8,8 pp (decisiones_fase6.md,
  F6-18). El petróleo del Ejercicio B sale de FMI.PCPS.POILAPSP_USD. Esta
  ficha y sus vintages no cambian.
