modelo_id: "MULT.VAR_DIF.G2"
familia: "multivariado"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.IVAE.VOL.SA.Q", "BCR.REMESAS.NOM.NSA.Q"]
  ordenes: {diferencias: 1, p_min: 1, p_max: 3}
  hiperparametros: {forma: "VAR(p) en Δ de los log-niveles (Δy del PIB SA y Δlog de las predictoras) con constante y dummies estacionales centradas (vars, season = 4; alguna serie es NSA)", criterio: "BIC (SC de vars::VARselect), misma muestra para todos los candidatos, p en 1..3", estimacion: "vars::VAR(type = \"const\", season = 4), MCO por ecuación", sendero: "y_o más la suma de los Δy pronosticados (vars::predict)", densidad: "pesos MA de la forma VAR (vars::Phi): error del log-nivel del PIB lineal en las innovaciones futuras, cov = G (I_h ⊗ Σ_u) G'; Σ_u = crossprod(resid) / (obs − regresores por ecuación), la de vars:::.fecov (F5-12, B2-1); con los pesos acumulados Ψ_m = Σ_{i<=m} Φ_i por estar en diferencias", piso_gl: "n_obs = observaciones de la ecuación con p = 3, n_par = 3 p_max + 1 + 3 = 13"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO", "T003_AGREGACION_TRIMESTRAL_IVAE", "T005_AGREGACION_TRIMESTRAL_REMESAS_NOM"]
justificacion: "VAR en diferencias de G2 con PIB SA + IVAE + remesas nominales (F5-07; B1b-2 para las series). p en 1..3 por BIC, rejilla fija en todos los orígenes del grupo (B2-2): en el primer origen (2014-Q4, muestra desde 2005-Q1) 36 observaciones y 13 parámetros por ecuación con p = 3: 23 grados de libertad; con p = 4 quedarían 19, bajo el piso; G-8 lo verifica en cada origen con el mayor candidato. Constante y dummies estacionales centradas porque las remesas son NSA (B2-1). Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Las predictoras entran como log de sus agregados trimestrales hasta o (F5-04, parte 1); la muestra empieza donde empiezan todas las series del modelo. Devuelve el sendero h = 1..8 en log-nivel (contrato de modelo, especificación del motor §2) y su densidad gaussiana plug-in (F5-12). Diagnósticos por origen en diagnosticos.csv: p elegido, observaciones y módulo máximo de las raíces de la forma compañera. Implementación: src/evaluacion/modelos_multivariados.R, modelo_var(), ajustar_var(), pesos_ma_var() y cov_sendero_var(). Declarado el 2026-10-07, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8)."
referencia_bibliografica: "Sims, C. A. (1980). Macroeconomics and reality. Econometrica, 48(1), 1-48; Lütkepohl, H. (2005). New Introduction to Multiple Time Series Analysis. Springer, caps. 2-4; Pfaff, B. (2008). VAR, SVAR and SVEC models: Implementation within R package vars. Journal of Statistical Software, 27(4)"
