modelo_id: "MULT.VAR_NIV.G1"
familia: "multivariado"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.REMESAS.NOM.NSA.Q", "BCR.EXPORT_FOB.NOM.NSA.Q"]
  ordenes: {diferencias: 0, p_min: 1, p_max: 4}
  hiperparametros: {forma: "VAR(p) en log-niveles con constante y dummies estacionales centradas (vars, season = 4), sin imponer raíces unitarias ni tendencia determinística (B2-1)", criterio: "BIC (SC de vars::VARselect), misma muestra para todos los candidatos, p en 1..4", estimacion: "vars::VAR(type = \"const\", season = 4), MCO por ecuación", sendero: "pronóstico del log-nivel del PIB (vars::predict)", densidad: "pesos MA de la forma VAR (vars::Phi): error del log-nivel del PIB lineal en las innovaciones futuras, cov = G (I_h ⊗ Σ_u) G'; Σ_u = crossprod(resid) / (obs − regresores por ecuación), la de vars:::.fecov (F5-12, B2-1); la diagonal reproduce la varianza de predict()", piso_gl: "n_obs = observaciones de la ecuación con p = 4, n_par = 3 p_max + 1 + 3 = 16"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO", "T005_AGREGACION_TRIMESTRAL_REMESAS_NOM", "T008_AGREGACION_TRIMESTRAL_EXPORT_FOB"]
justificacion: "VAR en log-niveles de G1 con PIB SA + remesas nominales + FOB (F5-07), sin imponer raíces unitarias: con raíces unitarias la constante genera la deriva (B2-1, descartada la tendencia lineal). p en 1..4 por BIC, rejilla fija (B2-2): en el primer origen (2013-Q1) 73 observaciones y 16 parámetros por ecuación con p = 4: 57 grados de libertad. Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Las predictoras entran como log de sus agregados trimestrales hasta o (F5-04, parte 1); la muestra empieza donde empiezan todas las series del modelo. Devuelve el sendero h = 1..8 en log-nivel (contrato de modelo, especificación del motor §2) y su densidad gaussiana plug-in (F5-12). Diagnósticos por origen: p elegido, observaciones y módulo máximo de las raíces de la forma compañera (cerca de 1 si hay raíz unitaria; no hay guarda de estabilidad). Implementación: src/evaluacion/modelos_multivariados.R, modelo_var(forma = \"niv\"). Declarado el 2026-10-07, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8)."
referencia_bibliografica: "Sims, C. A. (1980). Macroeconomics and reality. Econometrica, 48(1), 1-48; Lütkepohl, H. (2005). New Introduction to Multiple Time Series Analysis. Springer, caps. 2-4; Pfaff, B. (2008). VAR, SVAR and SVEC models: Implementation within R package vars. Journal of Statistical Software, 27(4)"
