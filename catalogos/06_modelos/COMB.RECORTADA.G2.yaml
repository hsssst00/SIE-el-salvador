modelo_id: "COMB.RECORTADA.G2"
familia: "combinacion"
especificacion:
  variables: ["PIB.SA.PROPIO.Q"]
  ordenes: {h_max: 8, min_miembros: 2}
  hiperparametros: {esquema: "media recortada al 10 % de los log-niveles (base::mean(trim = 0,1): ⌊0,1 M⌋ miembros de cada lado; 1 con los 12 miembros de G2; con los 8 de miembros_representantes, 0: en esas variantes coincide con la media)", miembros: ["UNI.ARIMA", "UNI.UC_LLT", "UNI.ARIMAX.G2", "UNI.ARIMAX_IVAE.G2", "MULT.VAR_DIF.G2", "MULT.BVAR.G2", "REG.ENET.G2", "REG.PCR.G2", "MIX.UMIDAS.G2", "MIX.PUENTE.G2", "ML.RF.G2", "ML.LGBM.G2"], miembros_representantes: ["UNI.ARIMA", "UNI.UC_LLT", "UNI.ARIMAX.G2", "UNI.ARIMAX_IVAE.G2", "MULT.VAR_DIF.G2", "REG.ENET.G2", "MIX.PUENTE.G2", "ML.RF.G2"], recorte: 0.1, densidad: "ninguna (F5-12): las columnas de calibración quedan vacías"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO"]
justificacion: "Media recortada al 10 % de los 12 modelos de Fase 5 de G2, sin los benchmarks (F5-13): los miembros se fijan aquí antes de la corrida única sobre L3 (F5-02) y main() comprueba que son los modelos de Fase 5 presentes en el experimento. No es un modelo del contrato: es un paso posterior del orquestador (correr_experimento()) sobre los senderos de los miembros, en la principal F5_G2 con los 12 miembros y en las variantes R1, R2, R5 y R6 de G2 con los 8 de miembros_representantes (los univariados de B1 y los representantes de F5-14c; no es la misma combinación que la principal, F5-14e); R7 no lleva combinaciones (B5-4). Combina el log-nivel de cada h, que equivale a combinar el crecimiento acumulado porque y_o es común. Sin densidad (F5-12). Implementación: src/evaluacion/combinaciones.R (combinar_pronosticos()). Declarado el 2026-10-08, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8). Decisiones B5-1 a B5-5 delegadas al agente (se pueden reabrir)."
referencia_bibliografica: "Stock, J. H. y Watson, M. W. (2004). Combination forecasts of output growth in a seven-country data set. Journal of Forecasting, 23(6), 405-430; Timmermann, A. (2006). Forecast combinations. En G. Elliott, C. W. J. Granger y A. Timmermann (eds.), Handbook of Economic Forecasting, vol. 1, 135-196. Elsevier"
