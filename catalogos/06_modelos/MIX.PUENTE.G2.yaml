modelo_id: "MIX.PUENTE.G2"
familia: "midas"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.REMESAS.NOM.NSA.M", "BCR.EXPORT_FOB.NOM.NSA.M", "BCR.ITCER.IDX.NSA.M", "UT.DEMANDA_ELEC.GWH.NSA.M", "BCR.IVAE.VOL.SA.M", "BCR.IPM.IDX.NSA.M"]
  ordenes: {p_max_ar_mensual: 12, rezagos_pib: 1, h_max: 8}
  hiperparametros: {forma: "iterada (F5-05, F5-08): Δy_t = c + β'Δlog X_Q(t) + φ Δy_{t-1} + δ'D_t + e_t, con X_Q el agregado trimestral de cada predictora mensual y D las dummies T2..T4 si alguna es NSA; el sendero itera la ecuación con los agregados proyectados", meses: "cada mensual se completa hasta el último mes de o+8 con un AR(p)-BIC mensual en Δlog, p en 0..12, con dummies mensuales si es NSA (B3b-4); los meses de o+1 que el calendario admite entran observados (F5-04)", agregacion: "la regla de T00x (suma de los 3 meses en flujos, promedio en índices); el Δlog trimestral no depende de cuál (B3b-4)", estimacion: "MCO", densidad: "sistema lineal conjunto del puente y de los AR mensuales (F5-12), con el Δlog del agregado linealizado en los Δlog mensuales (pesos 1, 2, 3, 2, 1 sobre 3; B3b-5): cov = σ²_e A_e A_e' + Σ_i Σ_k Σ_u[i,k] A_i A_k' en los meses comunes; Σ_u = covarianza contemporánea completa de los residuos de los AR mensuales en los meses comunes; la innovación del puente, independiente de ellas (B3b-6); plug-in", guardas: "stop() si una predictora mensual no llega al último mes del origen, si la matriz pierde rango o si el número de condición de los regresores estandarizados supera 1e4 (B3b-2)", piso_gl: "n_obs = trimestres de la regresión, n_par = constante + 6 agregados + Δy_{t-1} + 3 dummies: 39 y 11 en el primer origen (28 grados de libertad)"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO", "T005_AGREGACION_TRIMESTRAL_REMESAS_NOM", "T008_AGREGACION_TRIMESTRAL_EXPORT_FOB", "T009_AGREGACION_TRIMESTRAL_ITCER", "T011_AGREGACION_TRIMESTRAL_UT_DEMANDA", "T003_AGREGACION_TRIMESTRAL_IVAE", "T010_AGREGACION_TRIMESTRAL_IPM"]
justificacion: "Ecuación puente de G2 con las 6 predictoras de G2 (UT con el rezago supuesto de 30 días de F5-04) en frecuencia mensual (F5-08): cada mensual se completa con su AR(p)-BIC mensual y se agrega al trimestre con la regla de T00x; regresión del Δlog trimestral del PIB SA sobre los agregados contemporáneos más un AR(1) del PIB. En el primer origen (2014-Q4) la regresión tiene 39 trimestres y 11 parámetros: 28 grados de libertad (F5-03, G-8). Usa el borde irregular: los meses de o+1 admitidos entran observados y el resto del trimestre se proyecta (F5-04, parte 1). Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Devuelve el sendero h = 1..8 en log-nivel y su densidad gaussiana del sistema conjunto (F5-12). Diagnósticos por origen en diagnosticos.csv: observaciones, número de condición, φ, σ_e, meses comunes de Σ_u y el p de cada AR mensual. Implementación: src/evaluacion/modelos_frecuencia_mixta.R (modelo_puente_grupo(), ajustar_puente(), sendero_puente(), cov_sistema_puente()). Declarado el 2026-10-08, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8). Decisiones B3b-2 y B3b-4 a B3b-6 delegadas al agente (se pueden reabrir)."
referencia_bibliografica: "Baffigi, A., Golinelli, R. y Parigi, G. (2004). Bridge models to forecast the euro area GDP. International Journal of Forecasting, 20(3), 447-460; Mariano, R. S. y Murasawa, Y. (2003). A new coincident index of business cycles based on monthly and quarterly series. Journal of Applied Econometrics, 18(4), 427-443"
