modelo_id: "UNI.ARIMAX_IVAE.G2"
familia: "univariado"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.IVAE.VOL.SA.Q"]
  ordenes: {diferencias_objetivo: 1, rezagos_predictoras: [0, 1], p_min: 0, p_max: 2, q_min: 0, q_max: 2, p_max_ar_predictoras: 4}
  hiperparametros: {forma: "Δy_t = c + β'x_t + δ'D_t + η_t, η ARMA(p, q)", predictoras: "Δlog de los agregados trimestrales, hasta el origen (F5-04, parte 1)", dummies_estacionales: "false (la predictora es SA)", criterio: "BIC sobre la grilla, misma muestra para todos los candidatos", estimacion: "stats::arima(method = \"ML\"); un candidato que no converge (error u optim code distinto de 0) se descarta y se cuenta en diagnosticos.csv", proyeccion_predictoras: "AR(p)-BIC en Δlog con constante (y dummies si es NSA), p en 0..4 sobre la muestra común de p = 4 y reestimado con la muestra máxima, con la historia de cada predictora hasta el origen (F5-05)", densidad: "sistema lineal conjunto del ARIMAX y de los AR de las predictoras; Σ = covarianza muestral contemporánea completa de los residuos en los períodos comunes (F5-12, B1-5)", guarda_colinealidad: "rango completo y número de condición de los regresores estandarizados <= 1e4, o el motor se detiene (B1b-1)", piso_gl: "n_obs = muestra común, n_par = 1 + regresores + max(p + q) de la grilla = 7"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO", "T003_AGREGACION_TRIMESTRAL_IVAE"]
justificacion: "ARIMAX de referencia de G2 con el IVAE como única predictora, el candidato más obvio (F5-06); el IVAE es SA y no lleva dummies; rezagos 0 y 1 (B1-2). Regresión con errores ARMA en la primera diferencia del objetivo (B1-1: d = 1 fijo; el sendero es y_o más la suma de los Δy pronosticados). Grilla fija en todos los orígenes de G2, acotada de antemano para el piso de 20 grados de libertad de F5-03 en el primer origen (B1-2); G-8 lo verifica en cada origen con el mayor candidato. Las predictoras entran como Δlog de sus agregados trimestrales hasta o (F5-04, parte 1) y se proyectan h pasos con su AR(p)-BIC (F5-05). Diagnósticos por origen en diagnosticos.csv: p y q elegidos, muestra, número de condición, correlación máxima entre predictoras, candidatos descartados y el orden del AR de cada predictora. Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Devuelve el sendero h = 1..8 en log-nivel (contrato de modelo, especificación del motor §2) y su densidad gaussiana plug-in (F5-12). Implementación: src/evaluacion/modelos_univariados.R, modelo_arimax(), ajustar_arimax(), seleccionar_ar_bic_x() y cov_sistema_arimax(). Declarado el 2026-10-05, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8)."
referencia_bibliografica: "Box, G. E. P., Jenkins, G. M., Reinsel, G. C. y Ljung, G. M. (2015). Time Series Analysis: Forecasting and Control, 5.ª ed. Wiley; Hyndman, R. J. y Athanasopoulos, G. (2021). Forecasting: Principles and Practice, 3.ª ed., cap. 10 (regresión dinámica). OTexts; Marcellino, M., Stock, J. H. y Watson, M. W. (2006). A comparison of direct and iterated multistep AR methods for forecasting macroeconomic time series. Journal of Econometrics, 135(1-2), 499-526"
