modelo_id: "UNI.ARIMAX.G3"
familia: "univariado"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.REMESAS.NOM.NSA.Q", "BCR.EXPORT_FOB.NOM.NSA.Q", "BCR.ITCER.IDX.NSA.Q", "UT.DEMANDA_ELEC.GWH.NSA.Q", "BCR.IVAE.VOL.SA.Q", "BCR.IPM.IDX.NSA.Q", "BCR.IPP.IDX.NSA.Q", "BCR.REMESAS.REAL.NSA.Q"]
  ordenes: {diferencias_objetivo: 1, rezagos_predictoras: [0], p_min: 0, p_max: 2, q_min: 0, q_max: 2, p_max_ar_predictoras: 4}
  hiperparametros: {forma: "Δy_t = c + β'x_t + δ'D_t + η_t, η ARMA(p, q)", predictoras: "Δlog de los agregados trimestrales, hasta el origen (F5-04, parte 1)", dummies_estacionales: "true (T2, T3, T4; alguna predictora es NSA)", criterio: "BIC sobre la grilla, misma muestra para todos los candidatos", estimacion: "stats::arima(method = \"ML\"); un candidato que no converge (error u optim code distinto de 0) se descarta y se cuenta en diagnosticos.csv", proyeccion_predictoras: "AR(p)-BIC en Δlog con constante (y dummies si es NSA), p en 0..4 sobre la muestra común de p = 4 y reestimado con la muestra máxima, con la historia de cada predictora hasta el origen (F5-05)", densidad: "sistema lineal conjunto del ARIMAX y de los AR de las predictoras; Σ = covarianza muestral contemporánea completa de los residuos en los períodos comunes (F5-12, B1-5)", guarda_colinealidad: "rango completo y número de condición de los regresores estandarizados <= 1e4, o el motor se detiene (B1b-1)", piso_gl: "n_obs = muestra común, n_par = 1 + regresores + max(p + q) de la grilla = 16"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO", "T005_AGREGACION_TRIMESTRAL_REMESAS_NOM", "T008_AGREGACION_TRIMESTRAL_EXPORT_FOB", "T009_AGREGACION_TRIMESTRAL_ITCER", "T011_AGREGACION_TRIMESTRAL_UT_DEMANDA", "T003_AGREGACION_TRIMESTRAL_IVAE", "T010_AGREGACION_TRIMESTRAL_IPM", "T007_AGREGACION_TRIMESTRAL_IPP", "T004_DEFLACTAR_REMESAS", "T006_AGREGACION_TRIMESTRAL_REMESAS_REAL"]
justificacion: "ARIMAX de G3 con sus ocho predictoras y solo el rezago 0 (F5-06, B1-2: con rezagos 0 y 1 no cabe en el piso en el primer origen, 2019-Q4). Lleva a la vez las remesas nominales y las reales, cuyos Δlog correlacionan alrededor de 0,99 (F4-23): se mantienen las dos (B1b-1), porque el pronóstico puntual de una regresión lineal no depende de cómo se reparte el efecto entre las dos (Δlog real = Δlog nominal - Δlog deflactor), con la guarda numérica de rango y número de condición. Regresión con errores ARMA en la primera diferencia del objetivo (B1-1: d = 1 fijo; el sendero es y_o más la suma de los Δy pronosticados). Grilla fija en todos los orígenes de G3, acotada de antemano para el piso de 20 grados de libertad de F5-03 en el primer origen (B1-2); G-8 lo verifica en cada origen con el mayor candidato. Las predictoras entran como Δlog de sus agregados trimestrales hasta o (F5-04, parte 1) y se proyectan h pasos con su AR(p)-BIC (F5-05). Diagnósticos por origen en diagnosticos.csv: p y q elegidos, muestra, número de condición, correlación máxima entre predictoras, candidatos descartados y el orden del AR de cada predictora. Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Devuelve el sendero h = 1..8 en log-nivel (contrato de modelo, especificación del motor §2) y su densidad gaussiana plug-in (F5-12). Implementación: src/evaluacion/modelos_univariados.R, modelo_arimax(), ajustar_arimax(), seleccionar_ar_bic_x() y cov_sistema_arimax(). Declarado el 2026-10-05, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8)."
referencia_bibliografica: "Box, G. E. P., Jenkins, G. M., Reinsel, G. C. y Ljung, G. M. (2015). Time Series Analysis: Forecasting and Control, 5.ª ed. Wiley; Hyndman, R. J. y Athanasopoulos, G. (2021). Forecasting: Principles and Practice, 3.ª ed., cap. 10 (regresión dinámica). OTexts; Marcellino, M., Stock, J. H. y Watson, M. W. (2006). A comparison of direct and iterated multistep AR methods for forecasting macroeconomic time series. Journal of Econometrics, 135(1-2), 499-526"
