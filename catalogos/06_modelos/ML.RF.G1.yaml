modelo_id: "ML.RF.G1"
familia: "ml"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.REMESAS.NOM.NSA.Q", "BCR.EXPORT_FOB.NOM.NSA.Q"]
  ordenes: {rezagos: [0, 1, 2, 3], K_validacion: 12, h_max: 8, num_arboles: 500, columnas: 12, mtry: [4], min_node_size: [5, 3], num_threads: 1}
  hiperparametros: {reoptimizacion: "q1", forma: "directa por h = 1..8 (F5-05): g_h(t) = y_{t+h} − y_t sobre Δy y el Δlog de cada predictora en t con rezagos 0..3 (F5-10, los predictores de F5-09), filas t + h <= o; sendero y_o + ĝ_h", ventana: "la de B3-2 (B4-1): en cada ventana de estimación (la final y cada interna), cada columna y g_h se residualizan por MCO sobre constante + dummies T2..T4 y las columnas se dividen por la raíz del promedio de sus residuos al cuadrado; los árboles parten las columnas residualizadas (la estandarización no los cambia) y el pronóstico de g_h es la parte determinista de la ventana más el del modelo; la fila de pronóstico se transforma con los coeficientes y escalas de la ventana", estimacion: "ranger::ranger(x, y, num.trees = 500, mtry, min.node.size, replace = TRUE, sample.fraction = 1, splitrule = variance, importance = none, oob.error = FALSE, num.threads = 1, seed): un bosque de regresión por candidato; pronóstico con predict(num.threads = 1, seed) (F5-10, B4-3)", rejilla: "mtry ∈ {⌈√p⌉, ⌈p/3⌉} (F5-10): con p = 12 columnas los dos valen 4 y la rejilla se deduplica (2 candidatos); min.node.size ∈ {5, 3}; ordenada de más a menos regularizado: min.node.size de mayor a menor y, dentro de cada uno, mtry de menor a mayor (B4-3)", validacion: "anidada (F5-11, B3-4): K = 12 orígenes internos o' = o − h − 11..o − h, estimación con las filas t + h <= o', ECM interno del crecimiento acumulado; se elige el mínimo (un empate va al más regularizado); reoptimización solo en los orígenes Q1 (variante Q1 de F5-11, activada por la cuenta final de F5-14, F5-14d, decidida por Harold el 2026-10-08): en los otros tres orígenes se reutiliza, para cada h, el candidato elegido en el último Q1 y los errores internos de la densidad se recalculan con los datos de o solo para ese candidato; el primer origen del grupo reoptimiza si no es Q1", densidad: "gaussiana con Σ = D R D (B4-2; F5-12, B3-5, B3-6), la misma de los regularizados: D² = ECM interno sin centrar del candidato elegido de cada h en sus 12 orígenes propios; R = correlaciones de los momentos sin centrar en los 12 orígenes internos comunes a h = 1..8 (o − 19..o − 8); no los errores OOB, que son de bootstrap dentro de muestra y no pseudo fuera de muestra temporales; la varianza sale de errores internos y no de un modelo de probabilidad", semilla: "cada estimación (interna o final) toma seed = sample.int(.Machine$integer.max, 1) del generador de R, que el motor siembra por (exp_id, modelo, origen) con semilla_de(); la misma semilla sirve a todos los candidatos de esa estimación; num.threads = 1. Es la forma en que se cumple la semilla del motor pasada explícitamente (seed =) de F5-15: estimar_predecir() no recibe semilla_de(), que el motor aplica con set.seed() antes de ajustar() (B4-3)", guardas: "stop() ante NA, columna sin variación no estacional en una ventana, un bosque con un número de árboles distinto del pedido, pronósticos no finitos, Σ no definida positiva (B3-7); sin bordes de rejilla que anotar (los dos hiperparámetros toman los valores extremos de F5-10)", piso_gl: "no aplica (piso_gl = FALSE, F5-10)"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO", "T005_AGREGACION_TRIMESTRAL_REMESAS_NOM", "T008_AGREGACION_TRIMESTRAL_EXPORT_FOB"]
justificacion: "Random forest de regresión de G1 con PIB SA + remesas nominales + FOB: 500 árboles con mtry y min.node.size elegidos por validación anidada (F5-10, F5-11), directo por h sobre el crecimiento acumulado (F5-05). Es el representante de bagging de la senda §6.6. La muestra empieza donde empiezan todas las series del modelo (1994-Q1); en el primer origen (2013-Q1) hay 73 filas con todos los rezagos y 12 columnas, la ventana interna más chica tiene 60 filas en h = 1 y 46 en h = 8 y la final 65 en h = 8 (B3-4: K = 12 en todo h; se declara que la selección es ruidosa en h = 8 en los primeros orígenes). Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Las predictoras entran como Δlog de sus agregados trimestrales hasta o (F5-04, parte 1). Devuelve el sendero h = 1..8 en log-nivel y su densidad gaussiana con la covarianza de los errores internos (F5-12, B4-2). Diagnósticos por origen en diagnosticos.csv: por h: candidato elegido, mtry, min.node.size, ECM interno y filas de la ventana interna más chica y de la final. Implementación: src/evaluacion/modelos_arboles.R (modelo_rf_grupo(), rejilla_rf(), estimar_predecir_rf()) sobre src/evaluacion/forma_directa.R (modelo_directo(), ajustar_directo()). Declarado el 2026-10-08, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8)."
referencia_bibliografica: "Breiman, L. (2001). Random forests. Machine Learning, 45(1), 5-32; Wright, M. N. y Ziegler, A. (2017). ranger: A fast implementation of random forests for high dimensional data in C++ and R. Journal of Statistical Software, 77(1), 1-17; Medeiros, M. C., Vasconcelos, G. F. R., Veiga, Á. y Zilberman, E. (2021). Forecasting inflation in a data-rich environment: the benefits of machine learning methods. Journal of Business and Economic Statistics, 39(1), 98-119; Marcellino, M., Stock, J. H. y Watson, M. W. (2006). A comparison of direct and iterated multistep AR methods for forecasting macroeconomic time series. Journal of Econometrics, 135(1-2), 499-526"
