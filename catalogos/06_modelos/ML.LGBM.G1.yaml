modelo_id: "ML.LGBM.G1"
familia: "ml"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.REMESAS.NOM.NSA.Q", "BCR.EXPORT_FOB.NOM.NSA.Q"]
  ordenes: {rezagos: [0, 1, 2, 3], K_validacion: 12, h_max: 8, num_leaves: [4, 8], learning_rate: 0.05, min_data_in_leaf: 5, rondas_min: 10, rondas_max: 500, paso_rondas: 10, num_threads: 1}
  hiperparametros: {forma: "directa por h = 1..8 (F5-05): g_h(t) = y_{t+h} − y_t sobre Δy y el Δlog de cada predictora en t con rezagos 0..3 (F5-10, los predictores de F5-09), filas t + h <= o; sendero y_o + ĝ_h", ventana: "la de B3-2 (B4-1): en cada ventana de estimación (la final y cada interna), cada columna y g_h se residualizan por MCO sobre constante + dummies T2..T4 y las columnas se dividen por la raíz del promedio de sus residuos al cuadrado; los árboles parten las columnas residualizadas (la estandarización no los cambia) y el pronóstico de g_h es la parte determinista de la ventana más el del modelo; la fila de pronóstico se transforma con los coeficientes y escalas de la ventana", estimacion: "lightgbm::lgb.train(objective = regression (L2), num_leaves, learning_rate = 0,05, min_data_in_leaf = 5, num_threads = 1, deterministic = TRUE, force_row_wise = TRUE, seed, verbose = -1) sobre lgb.Dataset(min_data_in_leaf = 5); sin bagging ni submuestreo de columnas (defectos de lightgbm), así que el ajuste no tiene componente aleatorio; un entrenamiento por num_leaves hasta la mayor ronda pedida y predict(num_iteration = rondas) para cada candidato (F5-10, B4-4)", rejilla: "num_leaves ∈ {4, 8} × rondas ∈ {10, 20, ..., 500} (100 candidatos; F5-10, B4-4); ordenada de más a menos regularizado: num_leaves de menor a mayor y, dentro de cada uno, rondas de menor a mayor", validacion: "anidada (F5-11, B3-4): K = 12 orígenes internos o' = o − h − 11..o − h, estimación con las filas t + h <= o', ECM interno del crecimiento acumulado; se elige el mínimo (un empate va al más regularizado); reoptimización en cada origen (la variante Q1 de F5-11 solo si la cuenta final de F5-14 la activa, F5-14d)", densidad: "gaussiana con Σ = D R D (B4-2; F5-12, B3-5, B3-6), la misma de los regularizados: D² = ECM interno sin centrar del candidato elegido de cada h en sus 12 orígenes propios; R = correlaciones de los momentos sin centrar en los 12 orígenes internos comunes a h = 1..8 (o − 19..o − 8); no los errores OOB, que son de bootstrap dentro de muestra y no pseudo fuera de muestra temporales; la varianza sale de errores internos y no de un modelo de probabilidad", semilla: "cada estimación (interna o final) toma seed = sample.int(.Machine$integer.max, 1) del generador de R, que el motor siembra por (exp_id, modelo, origen) con semilla_de(), y la pasa a lightgbm (seed =); num_threads = 1, deterministic = TRUE y force_row_wise = TRUE. Es la forma en que se cumple la semilla del motor pasada explícitamente de F5-15: estimar_predecir() no recibe semilla_de(), que el motor aplica con set.seed() antes de ajustar() (B4-4)", guardas: "stop() ante NA, columna sin variación no estacional en una ventana, un entrenamiento sin ninguna ronda, pronósticos no finitos, Σ no definida positiva; rondas elegidas en un extremo de la rejilla (10 o 500) solo a diagnosticos.csv (B3-7)", piso_gl: "no aplica (piso_gl = FALSE, F5-10)"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO", "T005_AGREGACION_TRIMESTRAL_REMESAS_NOM", "T008_AGREGACION_TRIMESTRAL_EXPORT_FOB"]
justificacion: "Gradient boosting (LightGBM) de G1 con PIB SA + remesas nominales + FOB: num_leaves y número de rondas elegidos por validación anidada (F5-10, F5-11), con learning_rate = 0,05 y min_data_in_leaf = 5, directo por h sobre el crecimiento acumulado (F5-05). Es el representante de boosting de la senda §6.6; con estas muestras está en el límite de lo razonable, y que no le gane al paseo es un resultado informativo (F5-10). La muestra empieza donde empiezan todas las series del modelo (1994-Q1); en el primer origen (2013-Q1) hay 73 filas con todos los rezagos y 12 columnas, la ventana interna más chica tiene 60 filas en h = 1 y 46 en h = 8 y la final 65 en h = 8 (B3-4: K = 12 en todo h; se declara que la selección es ruidosa en h = 8 en los primeros orígenes). Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Las predictoras entran como Δlog de sus agregados trimestrales hasta o (F5-04, parte 1). Devuelve el sendero h = 1..8 en log-nivel y su densidad gaussiana con la covarianza de los errores internos (F5-12, B4-2). Diagnósticos por origen en diagnosticos.csv: por h: candidato elegido, num_leaves, rondas, bandera de borde (10 o 500 rondas), ECM interno y filas de la ventana interna más chica y de la final. Implementación: src/evaluacion/modelos_arboles.R (modelo_lgbm_grupo(), rejilla_lgbm(), estimar_predecir_lgbm()) sobre src/evaluacion/forma_directa.R (modelo_directo(), ajustar_directo()). Declarado el 2026-10-08, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8)."
referencia_bibliografica: "Ke, G., Meng, Q., Finley, T., Wang, T., Chen, W., Ma, W., Ye, Q. y Liu, T.-Y. (2017). LightGBM: A highly efficient gradient boosting decision tree. Advances in Neural Information Processing Systems 30, 3146-3154; Friedman, J. H. (2001). Greedy function approximation: a gradient boosting machine. Annals of Statistics, 29(5), 1189-1232; Marcellino, M., Stock, J. H. y Watson, M. W. (2006). A comparison of direct and iterated multistep AR methods for forecasting macroeconomic time series. Journal of Econometrics, 135(1-2), 499-526"
