modelo_id: "MULT.VECM.G1"
familia: "multivariado"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.REMESAS.NOM.NSA.Q", "BCR.EXPORT_FOB.NOM.NSA.Q"]
  ordenes: {p_min_niveles: 1, p_max_niveles: 4, K_min: 2}
  hiperparametros: {rango: "traza de Johansen al 5 % dentro del origen (urca::ca.jo, type = \"trace\", spec = \"transitory\"); r = primer r0 cuya hipótesis r <= r0 no se rechaza (B2-3)", deterministicos: "ecdet = \"none\": constante no restringida (caso 3, deriva en niveles y relaciones sin tendencia) y dummies estacionales centradas (season = 4)", rezagos: "K = max(2, p del BIC del VAR en niveles con p en 1..4)", casos_limite: "r = 0: VAR en Δ con K − 1 rezagos (el VECM anidado); r = 3: VAR en niveles con K rezagos; 0 < r < 3: vars::vec2var (B2-4)", densidad: "pesos MA de la forma VAR en niveles (vars::Phi del vec2var o del VAR usado), cov = G (I_h ⊗ Σ_u) G'; Σ_u = crossprod(resid) / obs en el vec2var (vars:::.fecovvec2var) y la de vars:::.fecov en los casos límite (F5-12)", piso_gl: "el mayor caso, VAR en niveles con K = 4: n_obs = observaciones con 4 rezagos, n_par = 3 · 4 + 1 + 3 = 16"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO", "T005_AGREGACION_TRIMESTRAL_REMESAS_NOM", "T008_AGREGACION_TRIMESTRAL_EXPORT_FOB"]
justificacion: "VECM de G1 con PIB SA + remesas nominales + FOB (F5-07). El rango de cointegración se elige en cada origen con la traza de Johansen al 5 % y constante no restringida (B2-3). Con r = 0 se estima el VECM anidado, un VAR en diferencias con K − 1 rezagos, y con r = 3 un VAR en niveles con K rezagos; el modelo_id no cambia y la forma usada se registra (B2-4). Con unas 77 observaciones la traza asintótica tiende a sobrerrechazar (más cointegración); se declara como límite. Con r = 0 y K − 1 igual al p de MULT.VAR_DIF.G1, los dos modelos coinciden en ese origen. Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Las predictoras entran como log de sus agregados trimestrales hasta o (F5-04, parte 1); la muestra empieza donde empiezan todas las series del modelo. Devuelve el sendero h = 1..8 en log-nivel (contrato de modelo, especificación del motor §2) y su densidad gaussiana plug-in (F5-12). Diagnósticos por origen: K, r, forma usada (0 = diferencias, 1 = VECM, 2 = niveles), observaciones, módulo máximo de las raíces y los estadísticos de traza. Implementación: src/evaluacion/modelos_multivariados.R, modelo_vecm(), ajustar_vecm() y rango_johansen(). Declarado el 2026-10-07, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8)."
referencia_bibliografica: "Johansen, S. (1988). Statistical analysis of cointegration vectors. Journal of Economic Dynamics and Control, 12(2-3), 231-254; Johansen, S. (1995). Likelihood-Based Inference in Cointegrated Vector Autoregressive Models. Oxford University Press; Lütkepohl, H. (2005). New Introduction to Multiple Time Series Analysis. Springer, caps. 6-8; Pfaff, B. (2008). Analysis of Integrated and Cointegrated Time Series with R, 2.ª ed. Springer"
