modelo_id: "MULT.BVAR.G1"
familia: "multivariado"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.REMESAS.NOM.NSA.Q", "BCR.EXPORT_FOB.NOM.NSA.Q"]
  ordenes: {lags: 4, n_draw: 10000, n_burn: 5000, n_thin: 1}
  hiperparametros: {priors: "BVAR::bv_priors(hyper = \"auto\"): Minnesota con λ jerárquico (bv_lambda(mode = 0.2, sd = 0.4, min = 1e-04, max = 5)), α = 2 fijo (bv_alpha(2, 0.25, 1, 3)), ψ fijo en la varianza residual σ² de MCO (denominador n − 5) de un AR(4) con constante de cada serie en la muestra del modelo, con límites ψ/100 y 100 ψ (bv_psi(scale = 0.004, shape = 0.004, mode = ψ); B2-15 y B2-16, en lugar de auto_psi, que devuelve σ aunque bvar usa ψ en unidades de varianza), var = 1e+07, b = 1; sum-of-coefficients bv_soc(mode = 1, sd = 1, min = 1e-04, max = 50) y single-unit-root bv_sur(mode = 1, sd = 1, min = 1e-04, max = 50) jerárquicos; salvo ψ, los valores por defecto de BVAR 1.0.5 (B2-7, B2-12)", mh: "bv_mh(scale_hess = 0.01, adjust_acc = TRUE, adjust_burn = 0.75, acc_lower = 0.25, acc_upper = 0.45, acc_change = 0.01): ajuste de la aceptación solo en el quemado (B2-7, B2-11)", desestacionalizacion: "cada serie NSA, dentro del origen y en la muestra del modelo: log-nivel ~ constante + tendencia lineal + dummies T2..T4 por MCO; se resta solo el componente estacional centrado (factores que suman cero en el año); PIB e IVAE son SA y no cambian (B2-5, B2-13, B2-14)", estimacion: "BVAR::bvar(lags = 4, n_draw = 10000, n_burn = 5000, n_thin = 1, fcast = NULL, irf = NULL), log-niveles con constante; semilla del motor semilla_de(exp_id, modelo_id, origen) (F5-15)", densidad: "momentos exactos de la predictiva posterior con choques del log-PIB en h = 1..8 sobre las 5 000 extracciones retenidas: media = promedio de μ_j (recursión del VAR de cada extracción), cov = promedio de C_j + cov(μ_j) (ley de varianza total, denominador S), con C_j de los pesos MA de la extracción y Σ_j; no usa predict.bvar, que en 1.0.5 no propaga los choques y los escala con Σ² (F5-12, B2-10)", sendero: "la media de la predictiva posterior (F5-12)", piso_gl: "no aplica (piso_gl = FALSE, B2-7): 13 parámetros por ecuación"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO", "T005_AGREGACION_TRIMESTRAL_REMESAS_NOM", "T008_AGREGACION_TRIMESTRAL_EXPORT_FOB"]
justificacion: "BVAR de G1 con PIB SA + remesas nominales + FOB (3 series) en log-niveles (F5-07). Giannone, Lenza y Primiceri (2015) con BVAR::bvar 1.0.5: p = 4, Minnesota con λ jerárquico y los dummies sum-of-coefficients y single-unit-root jerárquicos, ψ fijo en la varianza residual de un AR(4) por MCO (B2-15, B2-16), 10 000 extracciones y 5 000 de quemado con el ajuste de la aceptación del MH solo en el quemado (B2-7, B2-11, B2-12). La muestra empieza donde empiezan todas las series del modelo (1994-Q1); en el primer origen (2013-Q1) hay 77 observaciones, 73 efectivas con p = 4 y 13 parámetros por ecuación: el prior hace estimable el modelo y no hay piso de grados de libertad (B2-7). BVAR::bvar no admite regresores exógenos, así que cada serie NSA se desestacionaliza dentro del origen con dummies y tendencia lineal en la muestra del modelo (B2-5, B2-13, B2-14). Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Las predictoras entran como log de sus agregados trimestrales hasta o (F5-04, parte 1). Devuelve el sendero h = 1..8 en log-nivel (la media posterior, F5-12) y la media y la covarianza exactas de la predictiva posterior con choques (F5-12, B2-10). Diagnósticos por origen en diagnosticos.csv: observaciones efectivas, número de series, tasa de aceptación del MH, medias posteriores de λ, SOC y SUR y el ψ del PIB. Implementación: src/evaluacion/modelos_multivariados.R, modelo_bvar(), ajustar_bvar(), panel_bvar(), factores_estacionales(), psi_bvar() y momentos_predictiva_bvar(). Declarado el 2026-10-07, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8)."
referencia_bibliografica: "Giannone, D., Lenza, M. y Primiceri, G. E. (2015). Prior selection for vector autoregressions. Review of Economics and Statistics, 97(2), 436-451; Kuschnig, N. y Vashold, L. (2021). BVAR: Bayesian vector autoregressions with hierarchical prior selection in R. Journal of Statistical Software, 100(14), 1-27; Doan, T., Litterman, R. y Sims, C. (1984). Forecasting and conditional projection using realistic prior distributions. Econometric Reviews, 3(1), 1-100; Sims, C. A. y Zha, T. (1998). Bayesian methods for dynamic multivariate models. International Economic Review, 39(4), 949-968"
