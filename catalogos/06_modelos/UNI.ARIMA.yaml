modelo_id: "UNI.ARIMA"
familia: "univariado"
especificacion:
  variables: ["PIB.SA.PROPIO.Q"]
  ordenes: {p_min: 0, p_max: 4, q_min: 0, q_max: 4, d_max: 2, estacional: false}
  hiperparametros: {criterio: "BIC", busqueda: "exhaustiva (stepwise = FALSE, approximation = FALSE, order_constraint = p + q <= 8)", diferencias: "KPSS en nivel, rezagos short, al 5 %, hasta d_max, dentro del origen (diferencias_kpss)", constante: "la elige fable::ARIMA por BIC (solo con d <= 1)", estimacion: "máxima verosimilitud de fable::ARIMA", piso_gl: "n_obs = n - d, n_par = p_max + q_max + 1 (el mayor candidato)"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO"]
justificacion: "ARIMA(p, d, q) sobre y = log-nivel SA sin parte estacional (el objetivo ya es SA), con fable::ARIMA(y ~ pdq(p = 0:4, d, q = 0:4) + PDQ(0, 0, 0)) por BIC y búsqueda exhaustiva de los 25 candidatos (F5-06, tabla de la ficha v4). d se elige dentro del origen con la regla de fable y forecast::ndiffs: se diferencia mientras KPSS (nivel, rezagos short) rechaza estacionariedad al 5 %, hasta 2. fable la calcula con el paquete feasts, que no está en renv.lock; diferencias_kpss() la reproduce con urca::ur.kpss, ya en Imports: rechazar con p < 0,05 equivale a superar el valor crítico del 5 % de la misma tabla. Densidad: pesos ψ del ARIMA integrado y la varianza σ² del ajuste, la misma que usa el pronóstico de fable. Diagnósticos por origen: p, d, q y constante. Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Devuelve el sendero h = 1..8 en log-nivel (contrato de modelo, especificación del motor §2) y su densidad gaussiana plug-in (F5-12). Implementación: src/evaluacion/modelos_univariados.R, modelo_arima_fase5(), diferencias_kpss() y pesos_arima(). Declarado el 2026-10-05, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8)."
referencia_bibliografica: "Hyndman, R. J. y Khandakar, Y. (2008). Automatic time series forecasting: the forecast package for R. Journal of Statistical Software, 27(3), 1-22; Kwiatkowski, D., Phillips, P. C. B., Schmidt, P. y Shin, Y. (1992). Testing the null hypothesis of stationarity against the alternative of a unit root. Journal of Econometrics, 54(1-3), 159-178; Box, G. E. P., Jenkins, G. M., Reinsel, G. C. y Ljung, G. M. (2015). Time Series Analysis: Forecasting and Control, 5.ª ed. Wiley"
