modelo_id: "MIX.UMIDAS.G1"
familia: "midas"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.REMESAS.NOM.NSA.M", "BCR.EXPORT_FOB.NOM.NSA.M"]
  ordenes: {lags_mensuales: [0, 1, 2, 3, 4, 5], meses_del_borde: "todos los de o+1 admitidos (F5-04)", K_validacion: 12, h_max: 8}
  hiperparametros: {forma: "directa por h = 1..8 (F5-05): g_h(t) = y_{t+h} − y_t sobre el Δlog mensual de cada predictora en meses fijos respecto del último mes del trimestre t, m(t): los d_i meses de t+1 que el calendario admite en el origen (borde irregular, F5-04) y, en G1, m(t)..m(t)−5 (F5-08); en G2 y G3 solo el último mes admitido, por el piso (B3b-1)", ventana: "la de B3-2: columnas y g_h residualizadas sobre constante + dummies T2..T4 en cada ventana; por Frisch-Waugh-Lovell, MCO con constante y dummies", estimacion: "MCO, una sola especificación sin hiperparámetros", validacion: "la de F5-11 (K = 12 orígenes internos por h) solo para los errores internos de la densidad (B3b-3)", densidad: "gaussiana con Σ = D R D de los errores internos sin centrar (F5-12, B3-5, B3-6, B3b-3)", guardas: "G-8 con la estimación final de h = 8 antes de la validación anidada; stop() si el MCO pierde rango o si el número de condición de las columnas de la ventana final supera 1e4 (B3b-2)", piso_gl: "n_obs = filas de la estimación final de h = 8, n_par = columnas + constante + 3 dummies: 67 y 20 en el primer origen (47 grados de libertad)"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO"]
justificacion: "U-MIDAS sin restricciones de G1 con remesas nominales y FOB en frecuencia mensual (F5-08), directo por h sobre el crecimiento acumulado (F5-05) con la infraestructura de la forma directa. Columnas: 2 predictoras × 8 meses (m(t)+2, m(t)+1 y m(t)..m(t)−5) = 16 columnas. En el primer origen (2013-Q1) la estimación final de h = 8 tiene 67 filas y 20 parámetros: 47 grados de libertad, sobre el piso de 20 (F5-03, G-8); con un mes más por predictora en G2 y G3 quedaría bajo el piso (B3b-1). Es, con la ecuación puente, el único modelo que usa los meses de o+1 (F5-04, parte 1): la diferencia con la ARIMAX en h = 1 mide el valor del borde irregular. Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Devuelve el sendero h = 1..8 en log-nivel y su densidad gaussiana con la covarianza de los errores internos (F5-12). Diagnósticos por origen en diagnosticos.csv: por h, ECM interno, filas de la ventana interna más chica y de la final, y número de condición. Implementación: src/evaluacion/modelos_frecuencia_mixta.R (modelo_umidas_grupo(), matriz_umidas(), especificacion_umidas()) sobre src/evaluacion/forma_directa.R. Declarado el 2026-10-08, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8). Decisiones B3b-1 a B3b-3 delegadas al agente (se pueden reabrir)."
referencia_bibliografica: "Foroni, C., Marcellino, M. y Schumacher, C. (2015). Unrestricted mixed data sampling (MIDAS): MIDAS regressions with unrestricted lag polynomials. Journal of the Royal Statistical Society, Series A, 178(1), 57-82; Ghysels, E., Santa-Clara, P. y Valkanov, R. (2004). The MIDAS touch: Mixed data sampling regression models. Working paper, UCLA y UNC"
