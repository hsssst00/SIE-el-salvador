modelo_id: "REG.PCR.G3"
familia: "regularizado"
especificacion:
  variables: ["PIB.SA.PROPIO.Q", "BCR.REMESAS.NOM.NSA.Q", "BCR.EXPORT_FOB.NOM.NSA.Q", "BCR.ITCER.IDX.NSA.Q", "UT.DEMANDA_ELEC.GWH.NSA.Q", "BCR.IVAE.VOL.SA.Q", "BCR.IPM.IDX.NSA.Q", "BCR.IPP.IDX.NSA.Q", "BCR.REMESAS.REAL.NSA.Q"]
  ordenes: {rezagos: [0, 1, 2, 3], K_validacion: 12, h_max: 8, k_min: 1, k_max: 5}
  hiperparametros: {forma: "directa por h = 1..8 (F5-05): g_h(t) = y_{t+h} − y_t sobre los k primeros componentes principales de Δy y el Δlog de cada predictora en t con rezagos 0..3 (F5-09; los rezagos del PIB entran al PCA, B3-3), filas t + h <= o; sendero y_o + ĝ_h", ventana: "en cada ventana de estimación (la final y cada interna), cada columna y g_h se residualizan por MCO sobre constante + dummies T2..T4 y las columnas se dividen por la raíz del promedio de sus residuos al cuadrado (B3-2); los componentes salen de esas columnas", estimacion: "stats::prcomp(center = FALSE, scale. = FALSE) sobre la ventana transformada y MCO de g_h residualizado sobre los k primeros componentes (por Frisch-Waugh-Lovell, el MCO con constante, dummies y k componentes)", rejilla: "k ∈ 1..5 (F5-09), de más a menos penalizado", validacion: "anidada (F5-11, B3-4): K = 12 orígenes internos o' = o − h − 11..o − h, estimación con las filas t + h <= o', ECM interno del crecimiento acumulado; se elige el mínimo (un empate va al k menor); reoptimización en cada origen (la variante Q1 de F5-11 solo si la cuenta final de F5-14 la activa, F5-14d)", densidad: "gaussiana con Σ = D R D (F5-12, B3-5, B3-6): D² = ECM interno sin centrar del candidato elegido de cada h en sus 12 orígenes propios; R = correlaciones de los momentos sin centrar en los 12 orígenes internos comunes a h = 1..8 (o − 19..o − 8); la varianza sale de errores internos y no de un modelo de probabilidad", guardas: "stop() ante NA, columna sin variación no estacional en una ventana, un componente k sin varianza (pérdida de rango o menos filas que parámetros) o un MCO sin rango, Σ no definida positiva; k = 5 solo a diagnosticos.csv (B3-7)", piso_gl: "no aplica (piso_gl = FALSE, F5-09)"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO", "T005_AGREGACION_TRIMESTRAL_REMESAS_NOM", "T008_AGREGACION_TRIMESTRAL_EXPORT_FOB", "T009_AGREGACION_TRIMESTRAL_ITCER", "T011_AGREGACION_TRIMESTRAL_UT_DEMANDA", "T003_AGREGACION_TRIMESTRAL_IVAE", "T010_AGREGACION_TRIMESTRAL_IPM", "T007_AGREGACION_TRIMESTRAL_IPP", "T006_AGREGACION_TRIMESTRAL_REMESAS_REAL"]
justificacion: "Regresión por componentes principales de G3 con PIB SA + las 8 predictoras de G3, con las remesas nominales y las reales (B1b-2: el elastic net y el PCR están penalizados y no usan predictoras_no_penalizadas()), k ∈ 1..5 por validación anidada (F5-09, F5-11), directo por h sobre el crecimiento acumulado (F5-05). La muestra empieza donde empiezan todas las series del modelo (2010-Q1); en el primer origen (2019-Q4) hay 36 filas con todos los rezagos y 36 columnas, la ventana interna más chica tiene 23 filas en h = 1 y 9 en h = 8 y la final 28 en h = 8 (B3-4: K = 12 en todo h; se declara que la selección es ruidosa en h = 8 en los primeros orígenes). Se reestima en cada origen o con la información de [inicio, o] y ventana expansiva (ADR-002); con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Las predictoras entran como Δlog de sus agregados trimestrales hasta o (F5-04, parte 1). Devuelve el sendero h = 1..8 en log-nivel y su densidad gaussiana con la covarianza de los errores internos (F5-12). Diagnósticos por origen en diagnosticos.csv: por h: k elegido, bandera de borde (k = 5), ECM interno y filas de la ventana interna más chica y de la final. Implementación: src/evaluacion/modelos_regularizados.R (modelo_pcr_grupo(), estimar_predecir_pcr()) sobre src/evaluacion/forma_directa.R (modelo_directo(), ajustar_directo()). Declarado el 2026-10-08, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8)."
referencia_bibliografica: "Stock, J. H. y Watson, M. W. (2002). Forecasting using principal components from a large number of predictors. Journal of the American Statistical Association, 97(460), 1167-1179; Stock, J. H. y Watson, M. W. (2002). Macroeconomic forecasting using diffusion indexes. Journal of Business and Economic Statistics, 20(2), 147-162; Marcellino, M., Stock, J. H. y Watson, M. W. (2006). A comparison of direct and iterated multistep AR methods for forecasting macroeconomic time series. Journal of Econometrics, 135(1-2), 499-526"
