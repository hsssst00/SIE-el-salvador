modelo_id: "BENCH.RW_SIN_DERIVA"
familia: "benchmark"
especificacion:
  variables: ["PIB.SA.PROPIO.Q"]
  ordenes: {}
  hiperparametros: {}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO"]
justificacion: "Paseo aleatorio sin deriva sobre el log-nivel: y_{o+h} = y_o. Sin parámetros estimados. Es el denominador del RMSE relativo en los tres grupos (F4-07) y el modelo de referencia de las comparaciones DM/HLN. Se reestima en cada origen o sobre y = log-nivel del objetivo, muestra [inicio, o]; en el diseño principal inicio = 1990-Q1 con ventana expansiva (ADR-002). Las variantes de robustez (R1 rodante, R2 tramo homogéneo, R5 objetivo oficial, R6 ajuste único de L3) cambian la muestra o el objetivo según el token del experimento en 07_experimentos.csv, no esta especificación. Con sa=reestimado_en_origen el objetivo es el ajuste X-13 reestimado en ese origen (F4-09, F4-09b). Devuelve el sendero h = 1..8 en log-nivel (contrato de modelo, especificación del motor §2). Implementación: src/evaluacion/modelos_referencia.R, modelo_rw_sin_deriva(). Declarado el 2026-09-24, antes de la primera corrida sobre L3 (checklist de Fase 4, C8)."
referencia_bibliografica: "Hyndman, R. J. y Athanasopoulos, G. (2021). Forecasting: Principles and Practice, 3.ª ed. OTexts, §5.2 (método ingenuo)"
