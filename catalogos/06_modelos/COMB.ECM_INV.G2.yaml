modelo_id: "COMB.ECM_INV.G2"
familia: "combinacion"
especificacion:
  variables: ["PIB.SA.PROPIO.Q"]
  ordenes: {h_max: 8, min_miembros: 2}
  hiperparametros: {esquema: "pesos w_m ∝ 1 / Σ_{o'} δ^((o − h) − o') e²_(m,o',h) sobre los orígenes o' del experimento con o' + h <= o, δ = 0,9; con menos de 8 errores, pesos iguales (F5-13); errores en yoy_pp contra el objetivo visto en o (B5-1)", miembros: ["UNI.ARIMA", "UNI.UC_LLT", "UNI.ARIMAX.G2", "UNI.ARIMAX_IVAE.G2", "MULT.VAR_DIF.G2", "MULT.BVAR.G2", "REG.ENET.G2", "REG.PCR.G2", "MIX.UMIDAS.G2", "MIX.PUENTE.G2", "ML.RF.G2", "ML.LGBM.G2"], delta: 0.9, min_errores: 8, densidad: "ninguna (F5-12): las columnas de calibración quedan vacías"}
  transformaciones_ref: ["T001_CONCAT_PIB_NSA", "T002_AJUSTE_ESTACIONAL_PROPIO"]
justificacion: "Pesos inversos al ECM descontado de los 12 modelos de Fase 5 de G2, sin los benchmarks (F5-13): los miembros se fijan aquí antes de la corrida única sobre L3 (F5-02) y main() comprueba que son los modelos de Fase 5 presentes en el experimento. No es un modelo del contrato: es un paso posterior del orquestador (correr_experimento()) sobre los senderos de los miembros, en la principal F5_G2 y en las variantes R1, R2, R5 y R6 de G2 (F5-14e); R7 no lleva combinaciones (B5-4). Combina el log-nivel de cada h, que equivale a combinar el crecimiento acumulado porque y_o es común. Sin densidad (F5-12). Diagnósticos por origen en diagnosticos.csv: número de errores y peso de cada miembro por h. Implementación: src/evaluacion/combinaciones.R (combinar_pronosticos()). Declarado el 2026-10-08, antes de cualquier corrida sobre L3 (preregistro F5-02; checklist de Fase 5, C8). Decisiones B5-1 a B5-5 delegadas al agente (se pueden reabrir)."
referencia_bibliografica: "Stock, J. H. y Watson, M. W. (2004). Combination forecasts of output growth in a seven-country data set. Journal of Forecasting, 23(6), 405-430; Timmermann, A. (2006). Forecast combinations. En G. Elliott, C. W. J. Granger y A. Timmermann (eds.), Handbook of Economic Forecasting, vol. 1, 135-196. Elsevier"
