modelo_id: "SAT.IPP"
familia: "satelite"
especificacion:
  variables: ["BCR.IPP.IDX.NSA.Q", "FMI.PETROLEO_APSP.USD.NSA.Q", "ESC.PETROLEO_APSP.USD.NSA.Q.BASE"]
  ordenes: {p_min: 0, p_max: 4, q_min: 0, q_max: 4, beta_0: "siempre"}
  hiperparametros: {forma: "ADL en Δlog (F6-15): Δlog X_t = c + δ'D_t + Σ_{i=1..p} φ_i Δlog X_{t−i} + Σ_{j=0..q} β_j Δlog Z_{t−j} + e_t, con X = índice de precios al productor y Z = petróleo (promedio APSP, USD)", dummies_estacionales: "true (T2, T3, T4; la predictora es NSA)", criterio: "BIC (n log(RSS/n) + k log n) sobre la grilla p, q en 0..4, misma muestra para todos los candidatos: los trimestres con cuatro rezagos de las dos series", estimacion: "MCO; el elegido se reestima con su muestra máxima, como seleccionar_ar_bic_x() de F5-05 (F6-15-c)", muestra: "desde el primer trimestre con las dos series hasta el origen o, sin las filas de 2020 y 2021 (F6-15); una sola estimación, en o (F6-04)", sendero: "la ecuación se itera desde el primer trimestre sin dato completo de X, con Δlog Z de la serie ESC.* del escenario y los rezagos observados de X; los trimestres completos de X posteriores a o entran como dato (F6-17-a)", error: "Σ_X = G (Σ_e ⊗ I_h) G' (F6-15-a): pesos MA del polinomio en φ desde el primer trimestre de la satélite y Σ_e = stats::cov de los residuos de las satélites que usa el modelo, en sus trimestres comunes; plug-in, independiente de las innovaciones del modelo", guardas: "stop() si la matriz del mayor candidato o la del elegido pierde rango, si el polinomio en φ tiene una raíz de módulo <= 1 o si el mayor candidato deja menos de PISO_GL = 20 grados de libertad (F6-15)", piso_gl: "n_obs = muestra del BIC, n_par = 1 + 3 + p_max + q_max + 1 = 13", escenarios: "el petróleo no cambia entre escenarios (F6-14): los tres usan ESC.PETROLEO_APSP.USD.NSA.Q.BASE (F6-18)"}
  transformaciones_ref: ["T007_AGREGACION_TRIMESTRAL_IPP", "T013_AGREGACION_TRIMESTRAL_PETROLEO", "T014_SENDERO_ESCENARIO_PETROLEO_BASE"]
justificacion: "Satélite de BCR.IPP.IDX.NSA.Q (F6-03, F6-15): traduce el sendero de Z de cada escenario (F6-14, F6-18) a un sendero de la predictora externa que reciben los modelos condicionables (F6-01). Común a G1, G2 y G3, a los modelos trimestrales y al puente, que usa su agregado trimestral desde el primer trimestre sin meses observados (F6-17). Forma ADL en Δlog estimada por MCO; se descartaron la corrección de error, que exige una relación de largo plazo que el Ejercicio A no evaluó, y la elasticidad fija, que es un supuesto sin fuente (F6-15). El término contemporáneo β_0 está siempre: sin él la satélite no transmite el escenario. Implementación: src/proyeccion/satelites.R, ajustar_satelite(), proyectar_satelite() y senderos_satelites(); pruebas sintéticas en tests/test-satelites.R. Declarada el 2026-10-21, antes de cualquier proyección sobre L3 (checklist de Fase 6, D3; preregistro F6-12)."
referencia_bibliografica: "Hendry, D. F. (1995). Dynamic Econometrics. Oxford University Press, cap. 7 (modelos autorregresivos de rezagos distribuidos); Waggoner, D. F. y Zha, T. (1999). Conditional forecasts in dynamic multivariate models. Review of Economics and Statistics, 81(4), 639-651"
