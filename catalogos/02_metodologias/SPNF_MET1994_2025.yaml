notas: "Desde ene-1994 los ingresos tributarios brutos se ajustan excluyendo devoluciones de ISR e IVA (nota propia del BCR). El tramo 2023-2024 de ESTA serie NO incluye transacciones del Instituto Salvadoreño de Pensiones (ISP), que la serie vigente sí incorpora desde ene-2025 — diferencia de alcance conceptual, no solo de ventana temporal. Identificado vía búsqueda externa de Claude (2026-08-11), URL https://estadisticas.bcr.gob.sv/serie/sector-publico-no-financiero — pendiente verificación directa de Harold. Ver 09_rupturas.csv, R013."
