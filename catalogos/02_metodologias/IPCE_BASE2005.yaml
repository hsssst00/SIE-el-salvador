notas: "Base = promedio de 2005 (verificado empíricamente: promedio de los 12 valores mensuales de 2005 del Índice de Precios de Importación = 100.003). La nota de pie del BCR es ambigua sobre si 'vigencia a partir del año 2017' significa que la metodología actual se adoptó en 2017 y se aplicó retroactivamente hasta 2005, u otra cosa -- transcrita literalmente, no interpretada; no se preguntó a Harold por no ser bloqueante para admitir la serie (la cobertura y el valor de cada celda no dependen de esa ambigüedad). Sin predecesor catalogado en este proyecto -- no se afirma que no exista, solo que no se ha identificado ni documentado. Esta metodología cubre las tres series de la publicación (Exportación, Importación, Términos de Intercambio), no solo la admitida en 03_series.csv."
